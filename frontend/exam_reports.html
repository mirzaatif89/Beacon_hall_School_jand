<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examination Reports - Beacon Light School System</title>
    <link rel="icon" type="image/png" href="images/logo.jpeg">
    <link rel="stylesheet" href="style.css?v=20260814-centered-school-name">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .report-controls,.report-card{background:#fff;border:1px solid #cfe3dc;border-radius:12px;box-shadow:0 12px 28px rgba(15,23,42,.06)}.report-controls{display:grid;grid-template-columns:repeat(5,minmax(145px,1fr));gap:12px;padding:16px;margin-bottom:18px}.report-label{display:grid;gap:6px;color:#426554;font-size:.8rem;font-weight:800}.report-label select{width:100%;min-height:40px;padding:8px 10px;border:1px solid #cbded5;border-radius:8px;background:#fff;color:#24483a;font:inherit}.report-actions{display:flex;align-items:end;gap:9px}.report-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:9px 13px;border:0;border-radius:8px;background:#26885b;color:#fff;font-weight:850;cursor:pointer;white-space:nowrap}.report-button.secondary{background:#eef8f2;color:#176b4a;border:1px solid #bfe2d0}.report-button:disabled{opacity:.55;cursor:not-allowed}.report-card{max-width:960px;margin:auto;overflow:hidden}.report-head{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:12px;padding:18px 24px;text-align:center;background:#eff8f2;border-bottom:3px solid #238a5b}.report-logo{width:68px;height:68px;object-fit:contain;margin:auto}.report-head h2{margin:0;color:#123b2b;font-size:1.38rem}.report-head p{margin:.25rem 0 0;color:#48675a;font-weight:700}.report-title{padding:9px;background:#d7efe2;text-align:center;color:#153d2e;font-weight:900;letter-spacing:.08em}.student-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 20px}.student-meta div{border:1px solid #dcebe5;border-radius:8px;padding:8px 10px;background:#fbfefd}.student-meta b{display:block;margin-bottom:3px;color:#64748b;font-size:.68rem;letter-spacing:.05em;text-transform:uppercase}.report-table-wrap{padding:0 20px 16px;overflow:auto}.report-table{width:100%;min-width:620px;border-collapse:collapse}.report-table th,.report-table td{border:1px solid #cfe3dc;padding:9px 10px;text-align:center}.report-table th{background:#f2f9f5;color:#315d4a;font-size:.76rem;text-transform:uppercase}.report-table th:first-child,.report-table td:first-child{text-align:left}.report-table tfoot th{background:#e1f3e8;color:#153d2e}.report-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 20px 18px}.report-summary div{border:1px solid #cfe3dc;border-radius:8px;padding:10px;text-align:center;background:#f8fcfa}.report-summary b{display:block;color:#64748b;font-size:.72rem;text-transform:uppercase}.report-summary strong{display:block;margin-top:3px;font-size:1.18rem;color:#153d2e}.report-signatures{display:grid;grid-template-columns:repeat(3,1fr);gap:35px;padding:34px 38px 20px;text-align:center;color:#24483a;font-weight:750}.report-signatures span{border-top:1px solid #48675a;padding-top:7px}.empty-report{padding:45px 20px;text-align:center;color:#64748b}.page-actions{display:flex;justify-content:flex-end;gap:10px;margin-bottom:12px}@media(max-width:900px){.report-controls{grid-template-columns:repeat(2,minmax(0,1fr))}.report-actions{grid-column:span 2}.student-meta,.report-summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.report-controls,.student-meta,.report-summary{grid-template-columns:1fr}.report-actions{grid-column:auto}.report-head{grid-template-columns:1fr}.report-logo{margin-bottom:4px}}@media print{@page{size:A4 portrait;margin:10mm}body *{visibility:hidden}.report-card,.report-card *{visibility:visible}.report-card{position:absolute;inset:0;width:100%;max-width:none;border:0;box-shadow:none}.sidebar,.header,.page-actions,.report-controls{display:none!important}.report-head{padding:10px 18px}.report-table-wrap{padding:0 10px 10px}.student-meta,.report-summary{padding-left:10px;padding-right:10px}.report-signatures{padding-top:26px}}
    </style>
</head>
<body>
<div class="dashboard-container">
    <aside class="sidebar"><div class="logo-section"><img class="sidebar-logo-img" src="images/logo.jpeg" alt="Beacon Light School System logo"></div><nav class="nav-links"></nav><a href="settings.html" class="user-profile"><div class="avatar">A</div><div class="user-info"><h4>Administrator</h4><p>Admin</p></div></a></aside>
    <main class="main-content">
        <header class="header"><div><h1>Examination Reports</h1><p style="color:var(--text-secondary);margin-top:.3rem">View a student's saved exam result and print a report card.</p></div></header>
        <section class="report-controls">
            <label class="report-label">Class<select id="reportClass"><option value="">All Classes</option></select></label>
            <label class="report-label">Section<select id="reportSection" disabled><option value="">All Sections</option></select></label>
            <label class="report-label">Student<select id="reportStudent" disabled><option value="">Select Student</option></select></label>
            <label class="report-label">Exam<select id="reportExam" disabled><option value="">Select Exam</option></select></label>
            <div class="report-actions"><button class="report-button secondary" type="button" id="reloadReport"><i data-lucide="refresh-cw" width="17"></i> Refresh</button><button class="report-button" type="button" id="printReport" disabled><i data-lucide="printer" width="17"></i> Print</button></div>
        </section>
        <section class="report-card" id="reportCard"><div class="empty-report"><i data-lucide="file-search" width="34"></i><p>Select a student and an exam to view the report.</p></div></section>
    </main>
</div>
<script src="auth.js?v=20260814-live-auth-fix1"></script>
<script src="script.js?v=20260902-co-curriculum-save"></script>
<script>
(() => {
    const apiBase = typeof getApiBaseUrl === 'function' ? getApiBaseUrl() : `${location.origin}/api`;
    const token = sessionStorage.getItem('eduCore_token') || '';
    const headers = () => token ? { Authorization:`Bearer ${token}` } : {};
    let students = [], results = [];
    const classInput = document.getElementById('reportClass'), sectionInput = document.getElementById('reportSection'), studentInput = document.getElementById('reportStudent'), examInput = document.getElementById('reportExam'), reportCard = document.getElementById('reportCard'), printButton = document.getElementById('printReport');
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[char]));
    const norm = value => String(value || '').trim().toLowerCase().replace(/\s+/g, ' ');
    const typeName = value => typeof normalizeSchoolExamType === 'function' ? normalizeSchoolExamType(value) : String(value || '').trim();
    const gradeFor = percentage => percentage >= 90 ? 'A+' : percentage >= 80 ? 'A' : percentage >= 70 ? 'B' : percentage >= 60 ? 'C' : percentage >= 50 ? 'D' : 'F';
    const unique = values => [...new Map(values.map(value => String(value || '').trim()).filter(Boolean).map(value => [norm(value), value])).values()].sort();
    const reportRows = () => results.filter(record => String(record?.recordType || '') !== '__class_subject_total__' && String(record?.studentId || '') === String(studentInput.value || '') && record?.subject && record?.obtainedMarks !== '' && record?.obtainedMarks != null);
    function populateClasses() { const selected = classInput.value; const classes = unique(students.map(student => student.classGrade)); classInput.innerHTML = '<option value="">All Classes</option>' + classes.map(value => `<option value="${esc(value)}">${esc(value)}</option>`).join(''); classInput.value = classes.some(value => norm(value) === norm(selected)) ? selected : ''; }
    function populateSections() { const selected = sectionInput.value; const sections = unique(students.filter(student => !classInput.value || norm(student.classGrade) === norm(classInput.value)).map(student => student.section || 'General')); sectionInput.disabled = !sections.length; sectionInput.innerHTML = '<option value="">All Sections</option>' + sections.map(value => `<option value="${esc(value)}">${esc(value)}</option>`).join(''); sectionInput.value = sections.some(value => norm(value) === norm(selected)) ? selected : ''; }
    function populateStudents() { const selected = studentInput.value; const list = students.filter(student => (!classInput.value || norm(student.classGrade) === norm(classInput.value)) && (!sectionInput.value || norm(student.section || 'General') === norm(sectionInput.value))); studentInput.disabled = !list.length; studentInput.innerHTML = '<option value="">Select Student</option>' + list.map(student => `<option value="${esc(student.id)}">${esc(student.fullName || student.name || 'Unnamed Student')} — ${esc(student.classGrade || '-')} ${esc(student.section || '')}</option>`).join(''); studentInput.value = list.some(student => String(student.id) === String(selected)) ? selected : ''; }
    function populateExams() { const selected = examInput.value; const options = unique(reportRows().map(record => `${typeName(record.examType || record.examName || 'Exam')}|${String(record.examYear || record.session || '')}`)); examInput.disabled = !options.length; examInput.innerHTML = '<option value="">Select Exam</option>' + options.map(value => { const [type, year] = value.split('|'); return `<option value="${esc(value)}">${esc(type)}${year ? ` ${esc(year)}` : ''}</option>`; }).join(''); examInput.value = options.includes(selected) ? selected : ''; }
    function renderReport() {
        const student = students.find(item => String(item.id) === String(studentInput.value || ''));
        const selectedExam = examInput.value;
        const [examType, examYear] = selectedExam.split('|');
        const rows = selectedExam ? reportRows().filter(record => norm(typeName(record.examType || record.examName || 'Exam')) === norm(examType) && String(record.examYear || record.session || '') === String(examYear || '')) : [];
        printButton.disabled = !student || !rows.length;
        if (!student || !selectedExam || !rows.length) { reportCard.innerHTML = `<div class="empty-report"><i data-lucide="file-search" width="34"></i><p>${student && selectedExam ? 'No saved marks were found for this exam.' : 'Select a student and an exam to view the report.'}</p></div>`; if (window.lucide) lucide.createIcons(); return; }
        const obtained = rows.reduce((sum, row) => sum + Number(row.obtainedMarks || 0), 0), total = rows.reduce((sum, row) => sum + Number(row.totalMarks || 0), 0), percentage = total ? Math.round(obtained / total * 100) : 0, grade = gradeFor(percentage), logo = new URL('images/logo.jpeg', location.href).href;
        reportCard.innerHTML = `<header class="report-head"><img class="report-logo" src="${esc(logo)}" alt="School logo"><div><h2>BEACON LIGHT SCHOOL SYSTEM</h2><p>Jand Campus</p></div></header><div class="report-title">EXAMINATION REPORT CARD — ${esc(examType)} ${esc(examYear)}</div><section class="student-meta"><div><b>Student Name</b>${esc(student.fullName || student.name || '-')}</div><div><b>Father Name</b>${esc(student.fatherName || '-')}</div><div><b>Student ID / Roll No</b>${esc(student.studentCode || student.id || '-')} / ${esc(student.rollNo || '-')}</div><div><b>Class</b>${esc(student.classGrade || '-')}</div><div><b>Section</b>${esc(student.section || 'General')}</div><div><b>Exam Session</b>${esc(examType)} ${esc(examYear)}</div></section><div class="report-table-wrap"><table class="report-table"><thead><tr><th>Subject</th><th>Obtained Marks</th><th>Total Marks</th><th>Percentage</th><th>Grade</th></tr></thead><tbody>${rows.sort((a,b) => String(a.subject).localeCompare(String(b.subject))).map(row => `<tr><td>${esc(row.subject)}</td><td>${esc(row.obtainedMarks)}</td><td>${esc(row.totalMarks)}</td><td>${Math.round(Number(row.percentage ?? (Number(row.obtainedMarks) / Number(row.totalMarks) * 100)))}%</td><td>${esc(row.grade || gradeFor(Math.round(Number(row.obtainedMarks) / Number(row.totalMarks) * 100)))}</td></tr>`).join('')}</tbody><tfoot><tr><th>All Subjects</th><th>${obtained}</th><th>${total}</th><th>${percentage}%</th><th>${grade}</th></tr></tfoot></table></div><section class="report-summary"><div><b>Obtained Marks</b><strong>${obtained}</strong></div><div><b>Total Marks</b><strong>${total}</strong></div><div><b>Percentage</b><strong>${percentage}%</strong></div><div><b>Overall Grade</b><strong>${grade}</strong></div></section><footer class="report-signatures"><span>Class Teacher Signature</span><span>Parent / Guardian Signature</span><span>Principal Signature</span></footer>`;
        if (window.lucide) lucide.createIcons();
    }
    function updateFilters(from) { if (from === 'class') { sectionInput.value = ''; studentInput.value = ''; } if (from === 'section') studentInput.value = ''; populateSections(); populateStudents(); populateExams(); renderReport(); }
    async function loadData() { try { const [studentResponse, resultResponse] = await Promise.all([fetch(`${apiBase}/students`, { cache:'no-store' }), fetch(`${apiBase}/student-results`, { headers:headers(), cache:'no-store' })]); const studentData = await studentResponse.json().catch(() => ({})), resultData = await resultResponse.json().catch(() => ({})); if (!studentResponse.ok || !resultResponse.ok) throw new Error('Reports could not be loaded.'); students = Array.isArray(studentData) ? studentData : Array.isArray(studentData.students) ? studentData.students : []; results = Array.isArray(resultData.results) ? resultData.results : []; populateClasses(); populateSections(); populateStudents(); populateExams(); renderReport(); } catch (error) { reportCard.innerHTML = `<div class="empty-report">${esc(error.message || 'Reports could not be loaded.')} Reload after checking the server connection.</div>`; } }
    classInput.onchange = () => updateFilters('class'); sectionInput.onchange = () => updateFilters('section'); studentInput.onchange = () => { populateExams(); renderReport(); }; examInput.onchange = renderReport; document.getElementById('reloadReport').onclick = loadData; printButton.onclick = () => window.print(); loadData(); if (window.lucide) lucide.createIcons();
})();
</script>
</body>
</html>
