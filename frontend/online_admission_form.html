<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08755f">
  <title>Online Admission | Beacon Light School System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="website.css">
  <style>
    body{background:#f6f8f4}.admission-page{padding:48px 0 72px}.admission-card{max-width:820px;margin:auto;background:#fff;border:1px solid #dce9e2;border-radius:14px;box-shadow:0 18px 55px #123a3112;overflow:hidden}.admission-head{padding:32px 38px;background:#edf6f1;border-bottom:1px solid #dce9e2}.admission-head a{display:inline-block;color:#08755f;font-size:13px;font-weight:700;text-decoration:none;margin-bottom:12px}.admission-head h1{font:700 34px 'Playfair Display',serif;margin:0;color:#17342e}.admission-head p{margin:8px 0 0;color:#61776f}.admission-form{padding:30px 38px 38px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700;color:#29483e}.field input,.field select,.field textarea{width:100%;min-height:46px;padding:11px 13px;border:1px solid #ccddd4;border-radius:8px;background:#fff;color:#17342e;font:500 14px 'DM Sans',sans-serif}.field textarea{min-height:96px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid #08755f20;border-color:#08755f}.form-note{color:#668075;font-size:12px;margin:0 0 20px}.submit-row{display:flex;align-items:center;gap:14px;margin-top:24px;flex-wrap:wrap}.submit-row button{border:0;cursor:pointer}.submit-row button:disabled{opacity:.65;cursor:wait}.form-message{margin:0;font-size:14px;font-weight:600}.form-message.success{color:#08755f}.form-message.error{color:#a72c2c}@media(max-width:760px){.admission-page{padding:26px 0 44px}.admission-head,.admission-form{padding:24px 20px}.admission-head h1{font-size:29px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.wrap{width:min(100% - 34px,600px)}}
  </style>
</head>
<body>
  <div class="topbar"><div class="wrap"><span>Admissions are open — Join the Beacon family</span><div><a href="tel:+923015060341">0301-5060341</a><a href="mailto:beaconlightjand@gmail.com">beaconlightjand@gmail.com</a></div></div></div>
  <header><nav class="wrap"><a class="brand" href="website.html"><img src="images/logo.jpeg" alt="Beacon Light School System logo"><span>Beacon Light<small>School System · Jand</small></span></a><a class="nav-cta" href="website.html">Back to website</a></nav></header>
  <main class="admission-page wrap">
    <section class="admission-card">
      <div class="admission-head"><a href="website.html">← Back to school website</a><h1>Online Admission Application</h1><p>Share your details and our admissions team will contact you shortly.</p></div>
      <form class="admission-form" id="admissionForm">
        <p class="form-note">Fields marked * are required.</p>
        <div class="form-grid">
          <div class="field"><label for="studentName">Student name *</label><input id="studentName" name="studentName" autocomplete="name" required maxlength="160"></div>
          <div class="field"><label for="fatherName">Parent / guardian name *</label><input id="fatherName" name="fatherName" required maxlength="160"></div>
          <div class="field"><label for="phone">Phone number *</label><input id="phone" name="phone" type="tel" autocomplete="tel" required maxlength="40" placeholder="03XX-XXXXXXX"></div>
          <div class="field"><label for="applyingClass">Applying for class *</label><select id="applyingClass" name="applyingClass" required><option value="">Select class</option><option>Play Group</option><option>Nursarry</option><option>Prep</option><option>Class One</option><option>Class Two</option><option>Class Three</option><option>Class Four</option><option>Class Five</option><option>Class Six</option><option>Class Seven</option><option>Class Eight</option><option>Class Nine</option><option>Class 10</option></select></div>
          <div class="field"><label for="dateOfBirth">Student date of birth</label><input id="dateOfBirth" name="dateOfBirth" type="date"></div>
          <div class="field"><label for="gender">Gender</label><select id="gender" name="gender"><option value="">Select (optional)</option><option>Male</option><option>Female</option><option>Prefer not to say</option></select></div>
          <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="160"></div>
          <div class="field"><label for="campusName">Preferred campus</label><input id="campusName" name="campusName" value="Main Campus" maxlength="120"></div>
          <div class="field full"><label for="address">Home address</label><textarea id="address" name="address" maxlength="500"></textarea></div>
          <div class="field full"><label for="notes">Anything else we should know?</label><textarea id="notes" name="notes" maxlength="1000"></textarea></div>
        </div>
        <div class="submit-row"><button class="button gold" type="submit" id="submitAdmission">Submit application <span>→</span></button><p class="form-message" id="formMessage" aria-live="polite"></p></div>
      </form>
    </section>
  </main>
  <script>
    const form=document.getElementById('admissionForm');
    const message=document.getElementById('formMessage');
    const submitButton=document.getElementById('submitAdmission');
    form.addEventListener('submit',async event=>{
      event.preventDefault();message.textContent='';message.className='form-message';submitButton.disabled=true;
      const payload=Object.fromEntries(new FormData(form).entries());
      try{
        const response=await fetch('/api/online-admissions/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        const result=await response.json().catch(()=>({}));
        if(!response.ok||!result.success)throw new Error(result.message||'Application could not be submitted. Please try again.');
        form.reset();message.textContent=result.message||'Application submitted successfully.';message.classList.add('success');
      }catch(error){message.textContent=error.message||'Could not connect to the school server. Please try again.';message.classList.add('error');}
      finally{submitButton.disabled=false;}
    });
  </script>
</body>
</html>
