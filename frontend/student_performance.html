<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance - Beacon Light School System</title>
    <link rel="icon" type="image/png" href="images/logo.jpeg">
    <link rel="stylesheet" href="style.css?v=20260814-centered-school-name">
    <link rel="stylesheet" href="student_schedule_theme.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .performance-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 18px}
        .performance-steps.co-curriculum-mode{grid-template-columns:repeat(2,1fr)}
        .performance-step{box-sizing:border-box;min-height:110px;padding:16px 16px;border:1px solid #cfe3dc;border-radius:12px;background:#fff;color:#64748b;font-weight:800;line-height:1.5;display:flex;align-items:flex-start;gap:6px}
        .performance-step:has(.step-select){display:block}
        .performance-step.active{color:#176b4a;border-color:#35a56e;background:#effaf4;box-shadow:0 8px 20px rgba(53,165,110,.12)}
        .performance-layout{display:block}
        .step-select{display:block;width:100%;margin-top:8px;min-height:34px;padding:6px 9px;border:1px solid #cfe3dc;border-radius:8px;background:#fff;font:inherit;color:#24483a}
        .class-select{box-sizing:border-box;width:100%;min-height:44px;border:1px solid #cfe3dc;border-radius:10px;padding:10px;background:#fff;font:inherit;color:#24483a}
        .performance-panel{background:#fff;border:1px solid #cfe3dc;border-radius:12px;padding:18px;box-shadow:0 12px 28px rgba(15,23,42,.06)}
        .performance-panel h2{font-size:1.05rem;color:#153d2e;margin:0 0 14px}
        .choice-list{display:grid;gap:9px;max-height:540px;overflow:auto;padding-right:4px}
        .choice-button{width:100%;border:1px solid #d7e7e0;border-radius:10px;background:#f9fcfa;color:#24483a;padding:12px 13px;text-align:left;cursor:pointer;font:inherit;font-weight:750;display:flex;justify-content:space-between;align-items:center;gap:10px}
        .choice-button:hover,.choice-button.active{border-color:#35a56e;background:#edf9f2;color:#176b4a}
        .student-table-wrap{overflow:auto;max-height:540px}
        .student-table{width:100%;border-collapse:collapse;font-size:.9rem}
        .student-table th,.student-table td{padding:10px 12px;border-bottom:1px solid #dcebe5;text-align:left;vertical-align:middle}
        .student-table th{background:#eef7f2;color:#24483a;font-size:.78rem;letter-spacing:.04em}
        .student-table .student-name-heading{width:27%}
        .student-table .performance-heading-cell{text-align:center}
        .student-table tbody tr{cursor:pointer}
        .student-table tbody tr:hover,.student-table tbody tr.selected{background:#edf9f2}
        .student-rating-cells{display:grid;grid-template-columns:repeat(3,minmax(130px,1fr));gap:10px}
        .student-performance-row td{padding:14px 12px}
        .student-name-cell{width:27%;font-weight:800;color:#153d2e}
        .rating-check{appearance:auto;-webkit-appearance:checkbox;display:block;width:16px;height:16px;margin:auto;accent-color:#238a5b;cursor:pointer}
        .rating-check:focus-visible{outline:3px solid rgba(38,149,104,.2);outline-offset:2px}
        .rating-check:disabled{background:#f1f5f3;cursor:not-allowed;opacity:.65}
        .student-skill-block{margin-top:10px;padding:9px 12px;border-left:3px solid #35a56e;border-radius:6px;background:#f5faf7;color:#48675a;font-size:.8rem}
        .student-skill-block strong{color:#153d2e}
        .roster-actions{display:flex;justify-content:flex-end;padding-top:14px}
        @media(max-width:760px){.student-table{min-width:700px}.student-rating-cells{grid-template-columns:repeat(3,minmax(130px,1fr))}}
        .choice-meta{display:block;font-size:.75rem;color:#71847c;font-weight:600;margin-top:3px}
        .empty-state{padding:28px 18px;border:1px dashed #cbd5e1;border-radius:10px;text-align:center;color:#64748b;background:#f8fafc}
        .performance-heading{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
        .performance-heading h2{margin:0}
        .subject-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
        .subject-card{border:1px solid #d7e7e0;border-radius:10px;background:#fbfefd;padding:14px;text-align:left;cursor:pointer;font:inherit;color:#24483a}
        .subject-card:hover{border-color:#35a56e;background:#effaf4}
        .subject-card strong{display:block;margin-bottom:4px}
        .table-wrap{overflow:auto}
        .performance-table{width:100%;border-collapse:collapse;min-width:850px}
        .performance-table th,.performance-table td{padding:10px 9px;border-bottom:1px solid #e3eee9;text-align:left;vertical-align:top}
        .performance-table th{font-size:.75rem;text-transform:uppercase;color:#426554;background:#f5faf7}
        .skill-input,.outcome-input,.date-input,.month-input,.filter-input,.filter-select,.performance-textarea{box-sizing:border-box;width:100%;min-height:40px;border:1px solid #cbded5;border-radius:8px;padding:8px 10px;font:inherit;background:#fff}
        .performance-textarea{min-height:92px;resize:vertical;line-height:1.45}
        .form-strip,.print-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end;margin-bottom:14px;padding:12px;border:1px solid #dcebe5;border-radius:10px;background:#f8fcfa}
        .field-label{display:grid;gap:6px;color:#48675a;font-weight:800;font-size:.82rem}
        .portfolio-field{font-size:1.05rem;min-height:40px;align-content:start}
        #performanceModal .performance-form-grid:first-of-type{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
        #performanceModal .performance-form-grid:first-of-type .field-label:has(#modalPerformanceMonth){order:2;width:220px}
        #performanceModal .performance-form-grid:first-of-type .portfolio-field{order:1;width:220px}
        #performanceModal #modalPerformanceMonth{width:220px}
        #performanceModal .performance-form-grid:first-of-type{position:relative}
        #performanceModal #addNewPerformance{position:absolute;top:0;right:0}
        #performanceModal .performance-form-grid:nth-of-type(2){grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
        #performanceModal #modalSkill,#performanceModal #modalLearningOutcome{min-height:76px;max-height:96px}
        #performanceModal .rubric-grid{gap:14px;margin-top:2px}
        #performanceModal .rubric-card{padding:12px;background:#f8fcfa;box-shadow:0 3px 10px rgba(15,61,46,.04)}
        #performanceModal .rubric-card .performance-textarea{min-height:82px;max-height:105px}
        #performanceModal .rubric-card.is-disabled{opacity:.55}
        .action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
        .action-button{border:0;border-radius:9px;background:#35a56e;color:#fff;padding:10px 14px;font-weight:850;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
        .action-button.secondary{background:#eef8f2;color:#176b4a;border:1px solid #bfe2d0}
        .action-button.danger{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}
        .action-button:disabled{opacity:.55;cursor:not-allowed}
        .back-link{display:inline-flex;align-items:center;gap:7px;color:#176b4a;font-weight:800;text-decoration:none;margin-bottom:12px}
        .record-list{display:grid;gap:8px;margin-top:14px}
        .record-card{border:1px solid #dcebe5;border-radius:10px;padding:10px 12px;background:#fbfefd}
        .record-card strong{color:#153d2e}.record-card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
        .badge{display:inline-flex;padding:4px 9px;border-radius:999px;background:#e8f7ef;color:#176b4a;font-weight:850;font-size:.78rem}
        .print-divider{border:0;border-top:1px solid #dcebe5;margin:18px 0}
        .performance-modal{position:fixed;inset:0;z-index:4000;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.45);padding:18px}
        .performance-modal.open{display:flex}
        .performance-dialog{width:min(980px,100%);max-height:92vh;overflow:auto;background:#fff;border:1px solid #cfe3dc;border-radius:14px;box-shadow:0 24px 70px rgba(15,23,42,.22)}
        .performance-dialog-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid #e3eee9;background:#f8fcfa}
        .performance-dialog-head h2{margin:0;color:#153d2e;font-size:1.18rem}.performance-dialog-head p{margin:.3rem 0 0;color:#64748b}
        .modal-close{width:38px;height:38px;border:1px solid #cfe3dc;border-radius:9px;background:#fff;color:#176b4a;display:grid;place-items:center;cursor:pointer}
        .performance-form{display:grid;gap:14px;padding:18px 20px}
        .performance-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
        .rubric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
        .rubric-card{border:1px solid #dcebe5;border-radius:10px;background:#fbfefd;padding:12px}
        .rubric-card .field-label{color:#176b4a}
        .modal-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding:0 20px 20px}
        @media(max-width:900px){.performance-layout{grid-template-columns:1fr}.performance-steps{grid-template-columns:1fr}.performance-heading{display:grid}.performance-form-grid,.rubric-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div class="dashboard-container">
    <aside class="sidebar"><div class="logo-section"><img class="sidebar-logo-img" src="images/logo.jpeg" alt="Beacon Light School System logo"></div><nav class="nav-links"></nav><a href="settings.html" class="user-profile"><div class="avatar">A</div><div class="user-info"><h4>Administrator</h4><p>Admin</p></div></a></aside>
    <main class="main-content">
        <a class="back-link" href="student_scheduling.html"><i data-lucide="arrow-left" width="18"></i> Back to Student Scheduling</a>
        <header class="header"><div><h1>Student Performance</h1><p style="color:var(--text-secondary);margin-top:.3rem">Select a student, choose a subject, then add skill-wise performance.</p></div></header>
        <div class="performance-steps"><div class="performance-step active" id="stepClass">1. Select Class<select class="step-select" id="classStepSelect"><option value="">Select Class</option></select><select class="step-select" id="sectionStepSelect" disabled><option value="">Select Section</option></select></div><div class="performance-step" id="stepSubjects">2. Select Subject<select class="step-select" id="subjectStepSelect" disabled><option value="">Select Subject</option></select></div><div class="performance-step" id="stepSkills">3. Select Skill<select class="step-select" id="skillStepSelect" disabled><option value="">Select Skill</option><option value="Learning">Learning</option><option value="Speaking">Speaking</option></select></div></div>
        <section class="performance-layout">
            <div class="performance-panel" id="workspace"><div class="empty-state"><i data-lucide="school" width="32"></i><p>Select a class and section to view its students.</p></div></div>
        </section>
    </main>
</div>
<script src="auth.js?v=20260814-live-auth-fix1"></script>
<script src="script.js?v=20260902-co-curriculum-save"></script>
<script src="student_schedule_sections.js?v=20260927-performance-roster"></script>
<script>
(() => {
    const apiBase = typeof getApiBaseUrl === 'function' ? getApiBaseUrl() : `${location.origin}/api`;
    const token = sessionStorage.getItem('eduCore_token') || '';
    const headers = () => ({ 'Content-Type':'application/json', ...(token ? { Authorization:`Bearer ${token}` } : {}) });
    const canonicalClasses = ['Play Group','Nursarry','Prep','Class One','Class Two','Class Three','Class Four','Class Five','Class Six','Class Seven','Class Eight','Class Nine','Class 10'];
    const juniorSubjects = ['English','Urdu','Mathematics','Science','Social Study','Islamiyat','Nazra','Math'];
    const seniorSubjects = ['English','Urdu','Mathematics','Science','Social Study','Islamiyat','Nazra','Math'];
    const ratings = ['Excellent','Satisfactory','Needs Practice'];
    const rubricSuggestions = {
        modalExcellent: [
            'Consistently demonstrates excellent understanding and completes work independently.',
            'Applies learned concepts confidently and accurately.',
            'Shows strong participation, effort, and attention to detail.',
            'Completes tasks creatively with very little guidance.'
        ],
        modalSatisfactory: [
            'Demonstrates a satisfactory understanding of the learning outcome.',
            'Completes work with occasional guidance and support.',
            'Shows steady progress and participates appropriately in class.',
            'Applies most concepts correctly and is developing confidence.'
        ],
        modalNeedsPractice: [
            'Needs additional practice to strengthen understanding of the concept.',
            'Requires regular guidance to complete the task confidently.',
            'Should improve accuracy and apply the skill more consistently.',
            'Would benefit from revision and focused practice at home.'
        ]
    };
    const performanceMode = new URLSearchParams(location.search).get('section') || location.hash.replace(/^#/, '').trim();
    let students = [];
    let courses = [];
    let scheduledSubjects = [];
    let selectedClass = '';
    let selectedStudentSection = '';
    let selectedStudent = null;
    let selectedSubject = '';
    let selectedSkill = '';
    let selectedRating = '';
    let selectedSection = 'Portfolio Skills Assessment Summary';
    let saved = [];
    let classPerformanceRecords = [];
    const pendingRatingChanges = new Map();
    let attendanceStore = {};
    let examResults = [];
    let teacherAssignedSubjects = null;
    let teacherAssignments = [];
    const teacherPortalClasses = [...new Set(String(new URLSearchParams(location.search).get('assignedClasses') || '').split('|').map(value => value.trim()).filter(Boolean))];
    let isTeacherUser = false;
    const classStepSelect = document.getElementById('classStepSelect');
    const sectionStepSelect = document.getElementById('sectionStepSelect');
    const subjectStepSelect = document.getElementById('subjectStepSelect');
    const skillStepSelect = document.getElementById('skillStepSelect');
    const workspace = document.getElementById('workspace');
    const steps = [document.getElementById('stepClass'), document.getElementById('stepSubjects'), document.getElementById('stepSkills')];
    if (performanceMode === 'co-curriculum' || performanceMode === 'participation') {
        document.getElementById('stepSubjects').style.display = 'none';
        skillStepSelect.style.display = 'none';
        document.querySelector('.performance-steps')?.classList.add('co-curriculum-mode');
        document.getElementById('stepSkills').firstChild.textContent = performanceMode === 'co-curriculum' ? '3. Co-Curriculum Performance' : '3. Participant Report';
    }
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const norm = value => String(value || '').trim().toLowerCase().replace(/\s+/g,' ');
    const logoSrc = new URL('images/logo.jpeg', location.href).href;
    const today = () => {
        const date = new Date();
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    };
    const thisMonth = () => today().slice(0, 7);
    const performanceIdFor = record => String(record.id || `PERF-${record.studentId}-${record.subject}-${record.performanceDate}-${record.skill || 'summary'}`).replace(/[^a-zA-Z0-9_-]+/g, '-').slice(0, 255);

    function mergePerformanceRecords(primary = [], fallback = []) {
        const merged = new Map();
        [...fallback, ...primary].forEach(record => {
            if (!record || !record.skill) return;
            const id = performanceIdFor(record);
            merged.set(id, { ...record, id });
        });
        return [...merged.values()].sort((a, b) => String(b.performanceDate || '').localeCompare(String(a.performanceDate || '')));
    }

    function setSteps(number) {
        steps.forEach((el, index) => el.classList.toggle('active', index < number));
    }

    function classNames() {
        if (isTeacherUser) {
            const assignedNames = [...teacherAssignments.map(item => item.classGrade), ...teacherPortalClasses]
                .map(value => String(value || '').trim())
                .filter(Boolean);
            return [...new Map(assignedNames.map(name => [norm(name), name])).values()];
        }
        const found = [...canonicalClasses, ...students.map(s => s.classGrade), ...courses.map(c => c.classGrade)]
            .map(value => String(value || '').trim())
            .filter(Boolean);
        return [...new Map(found.map(value => [norm(value), value])).values()];
    }

    function teacherCanAccessStudent(student) {
        if (!isTeacherUser) return true;
        const campus = norm(student.campusName || student.branchName || '');
        return teacherAssignments.some(assignment => {
            if (norm(assignment.classGrade) !== norm(student.classGrade)) return false;
            const assignedSection = norm(assignment.section);
            if (assignedSection && assignedSection !== 'general' && assignedSection !== norm(student.section || 'General')) return false;
            const assignedCampus = norm(assignment.campusName);
            return !campus || !assignedCampus || campus === assignedCampus;
        });
    }

    function subjectsForClass() {
        const excludedReportSubjects = new Set(['participation', 'co-curriculum', 'co curriculum']);
        const assignedToStudent = Array.isArray(selectedStudent?.subjects)
            ? selectedStudent.subjects
            : String(selectedStudent?.subjects || '').split(/[,|]/).map(value => value.trim()).filter(Boolean);
        const classSectionMatches = item => norm(item.classGrade) === norm(selectedClass)
            && (!String(item.section || '').trim() || norm(item.section) === norm(selectedStudentSection));
        const scheduledTitles = [
            ...courses.filter(classSectionMatches).map(c => String(c.title || c.subject || '').trim()),
            ...scheduledSubjects.filter(classSectionMatches).map(item => String(item.subject || item.title || '').trim())
        ].filter(Boolean);
        const titles = [
            ...scheduledTitles,
            ...saved.map(record => String(record.subject || '').trim())
        ].filter(value => value && !excludedReportSubjects.has(norm(value)));
        const fixedSubjects = ['Play Group','Nursarry','Prep'].some(name => norm(name) === norm(selectedClass)) ? juniorSubjects : seniorSubjects;
        const available = [...new Map([...fixedSubjects, ...scheduledTitles, ...assignedToStudent, ...titles].map(value => [norm(value), value])).values()];
        if (isTeacherUser) {
            return available.filter(subject => (teacherAssignedSubjects || []).some(assigned => norm(assigned) === norm(subject)));
        }
        return available;
    }

    function renderClasses() {
        classStepSelect.innerHTML = '<option value="">Select Class</option>' + classNames().map(name => `<option value="${esc(name)}">${esc(name)}</option>`).join('');
        classStepSelect.value = selectedClass;
        classStepSelect.onchange = () => selectClass(classStepSelect.value, '');
        const studentSections = students.filter(student => norm(student.classGrade) === norm(selectedClass) && teacherCanAccessStudent(student))
            .map(student => String(student.section || 'General').trim()).filter(Boolean);
        const assignmentSections = isTeacherUser ? teacherAssignments
            .filter(assignment => norm(assignment.classGrade) === norm(selectedClass))
            .map(assignment => String(assignment.section || 'General').trim()).filter(Boolean) : [];
        const portalHasClass = isTeacherUser && teacherPortalClasses.some(name => norm(name) === norm(selectedClass));
        const fallbackSection = portalHasClass && !studentSections.length && !assignmentSections.length ? ['General'] : [];
        let sectionOptions = [...new Set([...studentSections, ...assignmentSections, ...fallbackSection])].sort();
        sectionStepSelect.disabled = !selectedClass || !sectionOptions.length;
        sectionStepSelect.innerHTML = '<option value="">Select Section</option>' + sectionOptions.map(section => `<option value="${esc(section)}">${esc(section)}</option>`).join('');
        sectionStepSelect.value = selectedStudentSection;
        sectionStepSelect.onchange = () => selectClass(selectedClass, sectionStepSelect.value);
    }

    function selectClass(name, section = '') {
        selectedClass = name;
        selectedStudentSection = section;
        selectedStudent = null;
        selectedSubject = '';
        selectedSkill = '';
        saved = [];
        classPerformanceRecords = [];
        setSteps(1);
        renderClasses();
        const list = selectedStudentSection ? students.filter(student => norm(student.classGrade) === norm(name) && norm(student.section || 'General') === norm(selectedStudentSection)) : [];
        if (performanceMode === 'co-curriculum' || performanceMode === 'participation') {
            workspace.innerHTML = list.length ? `<div class="choice-list">${list.map(student => `<button type="button" class="choice-button" data-special-student="${esc(student.id)}">${esc(student.fullName || 'Unnamed Student')}</button>`).join('')}</div>` : `<div class="empty-state">${selectedStudentSection ? 'No students found in this class section.' : 'Select a section to continue.'}</div>`;
            workspace.querySelectorAll('[data-special-student]').forEach(button => button.onclick = () => selectStudent(button.dataset.specialStudent));
            return;
        }
        populateSubjectOptions();
        workspace.innerHTML = `<div class="empty-state">${list.length ? 'Select a subject, then a skill to view students.' : selectedStudentSection ? 'No students found in this class section.' : selectedClass ? 'Select a section to continue.' : 'Select a class to continue.'}</div>`;
    }

    function renderInitialStudentRoster() {
        renderStudentRoster();
    }

    async function selectStudent(id) {
        selectedStudent = students.find(student => String(student.id) === String(id));
        if (!selectedStudent) return;
        setSteps(2);
        try {
            const response = await fetch(`${apiBase}/student-performance?studentId=${encodeURIComponent(id)}`, { headers: headers() });
            const result = await response.json();
            if (!response.ok || !result.success) throw new Error(result.message || 'Performance could not be loaded.');
            saved = mergePerformanceRecords(result.performances || []);
        } catch (error) {
            saved = [];
            showAppAlert(error.message || 'Performance could not be loaded from the server.', 'Load Failed');
        }
        renderStudentRoster();
    }

    function renderSubjects() {
        if (performanceMode === 'co-curriculum') {
            renderCoCurriculumEditor();
            return;
        }
        if (performanceMode === 'participation') {
            renderParticipationEditor();
            return;
        }
        populateSubjectOptions();
        renderStudentRoster();
    }

    function populateSubjectOptions() {
        const subjects = subjectsForClass();
        subjectStepSelect.disabled = !selectedClass || !selectedStudentSection || !subjects.length;
        subjectStepSelect.innerHTML = '<option value="">' + (subjects.length ? 'Select Subject' : 'No Subjects Available') + '</option>' + subjects.map(subject => `<option value="${esc(subject)}">${esc(subject)}</option>`).join('');
        subjectStepSelect.value = subjects.some(subject => norm(subject) === norm(selectedSubject)) ? selectedSubject : '';
        skillStepSelect.disabled = !selectedSubject;
        skillStepSelect.value = selectedSkill;
        skillStepSelect.onchange = () => {
            selectedSkill = skillStepSelect.value;
            if (!selectedSkill) return;
            setSteps(3);
            loadClassPerformanceRecords().then(renderStudentRoster);
        };
        subjectStepSelect.onchange = () => {
            if (!subjectStepSelect.value) return;
            selectedSubject = subjectStepSelect.value;
            selectedSkill = '';
            skillStepSelect.value = '';
            skillStepSelect.disabled = false;
            setSteps(2);
            workspace.innerHTML = '<div class="empty-state">Now select a skill to view this section\'s students.</div>';
        };
    }

    function renderStudentRoster() {
        const roster = students.filter(student => norm(student.classGrade) === norm(selectedClass) && norm(student.section || 'General') === norm(selectedStudentSection));
        const subjects = subjectsForClass();
        workspace.innerHTML = `<div class="student-table-wrap"><table class="student-table"><thead><tr><th class="student-name-heading">STUDENT NAME</th><th class="performance-heading-cell" colspan="3">${selectedSubject ? `${esc(selectedSubject)} · ${esc(selectedSkill)}` : 'PERFORMANCE'}</th></tr><tr><th></th><th>EXCELLENT</th><th>SATISFACTORY</th><th>NEED PRACTICE</th></tr></thead><tbody>${roster.map(student => {
            const records = classPerformanceRecords.filter(record => String(record.studentId) === String(student.id) && norm(record.subject) === norm(selectedSubject) && norm(record.skill) === norm(selectedSkill));
            const ratingSelected = key => {
                const pending = ['excellent','satisfactory','needsPractice'].find(rating => pendingRatingChanges.get(`${student.id}|${selectedSubject}|${selectedSkill}|${rating}`)?.checked);
                if (pending) return pending === key;
                const latestRecord = [...records].sort((a, b) => String(b.performanceDate || '').localeCompare(String(a.performanceDate || '')))[0];
                const selectedRating = norm(latestRecord?.rating) === 'excellent' ? 'excellent' : norm(latestRecord?.rating) === 'satisfactory' ? 'satisfactory' : norm(latestRecord?.rating) === 'needs practice' ? 'needsPractice' : '';
                return selectedRating === key;
            };
            const ratings = ['excellent','satisfactory','needsPractice'];
            return `<tr class="student-performance-row${String(student.id) === String(selectedStudent?.id) ? ' selected' : ''}" data-student-id="${esc(student.id)}"><td class="student-name-cell"><strong>${esc(student.fullName || 'Unnamed Student')}</strong></td>${ratings.map(key => `<td><input type="checkbox" class="rating-check" aria-label="${key} for ${esc(student.fullName || 'student')}" data-student-id="${esc(student.id)}" data-rating="${key}" ${ratingSelected(key) ? 'checked' : ''} ${selectedSkill ? '' : 'disabled'}></td>`).join('')}</tr>`;
        }).join('')}</tbody></table></div><div class="roster-actions"><button type="button" class="action-button" id="saveSelectedPerformance" ${pendingRatingChanges.size ? '' : 'disabled'}><i data-lucide="save" width="17"></i> Save Performance</button></div>`;
        workspace.querySelectorAll('.student-performance-row').forEach(row => row.onclick = () => selectStudent(row.dataset.studentId));
        workspace.querySelectorAll('.rating-check').forEach(checkbox => checkbox.onchange = event => {
            event.stopPropagation();
            if (!selectedSkill) { checkbox.checked = false; skillStepSelect.focus(); return; }
            const student = students.find(item => String(item.id) === String(checkbox.dataset.studentId));
            if (!student) return;
            const changeKey = `${student.id}|${selectedSubject}|${selectedSkill}|${checkbox.dataset.rating}`;
            const storedRecord = classPerformanceRecords.find(record => String(record.studentId) === String(student.id) && norm(record.subject) === norm(selectedSubject) && norm(record.skill) === norm(selectedSkill) && norm(record.rating) === norm(checkbox.dataset.rating === 'excellent' ? 'Excellent' : checkbox.dataset.rating === 'satisfactory' ? 'Satisfactory' : 'Needs Practice'));
            const wasChecked = pendingRatingChanges.has(changeKey) ? pendingRatingChanges.get(changeKey).checked : Boolean(storedRecord);
            const row = checkbox.closest('.student-performance-row');
            if (checkbox.checked) {
                row.querySelectorAll('.rating-check').forEach(other => {
                    if (other === checkbox || !other.checked) return;
                    other.checked = false;
                    const otherKey = `${student.id}|${selectedSubject}|${selectedSkill}|${other.dataset.rating}`;
                    pendingRatingChanges.set(otherKey, { checked:false, student, subject:selectedSubject, skill:selectedSkill, ratingKey:other.dataset.rating });
                });
            }
            if (checkbox.checked === wasChecked) pendingRatingChanges.delete(changeKey);
            else pendingRatingChanges.set(changeKey, { checked:checkbox.checked, student, subject:selectedSubject, skill:selectedSkill, ratingKey:checkbox.dataset.rating });
            document.getElementById('saveSelectedPerformance').disabled = pendingRatingChanges.size === 0;
        });
        document.getElementById('saveSelectedPerformance').onclick = saveSelectedRatings;
    }

    async function saveSelectedRatings() {
        const button = document.getElementById('saveSelectedPerformance');
        if (!pendingRatingChanges.size || !button) return;
        button.disabled = true;
        const changes = [...pendingRatingChanges.entries()];
        try {
            for (const [changeKey, change] of changes) {
                const rating = change.ratingKey === 'excellent' ? 'Excellent' : change.ratingKey === 'satisfactory' ? 'Satisfactory' : 'Needs Practice';
                const matches = classPerformanceRecords.filter(record => String(record.studentId) === String(change.student.id)
                    && norm(record.subject) === norm(change.subject)
                    && norm(record.skill) === norm(change.skill)
                    && norm(record.rating) === norm(rating));
                if (change.checked && !matches.length) {
                    const percentage = rating === 'Excellent' ? 92 : rating === 'Satisfactory' ? 77 : 60;
                    const descriptionField = rating === 'Excellent' ? 'excellentDescription' : rating === 'Satisfactory' ? 'satisfactoryDescription' : 'needsPracticeDescription';
                    const record = {
                        id:`PERF-${change.student.id}-${change.subject}-${change.skill}-${rating}-${today()}`.replace(/[^a-zA-Z0-9_-]+/g, '-').slice(0, 255),
                        studentId:String(change.student.id), studentName:change.student.fullName || '',
                        classGrade:selectedClass, section:selectedStudentSection, subject:change.subject,
                        skill:change.skill, assessmentItem:change.skill,
                        assessmentSection:'Portfolio Skills Assessment Summary', learningOutcome:change.skill,
                        rating, grade:percentage >= 90 ? 'A+' : percentage >= 80 ? 'A' : percentage >= 70 ? 'B' : 'C',
                        percentage, [descriptionField]:`${rating} - ${change.skill}`,
                        performanceDate:today(), performanceMonth:thisMonth(), remarks:''
                    };
                    const response = await fetch(`${apiBase}/student-performance`, { method:'POST', headers:headers(), body:JSON.stringify(record) });
                    const result = await response.json().catch(() => ({}));
                    if (!response.ok || !result.success) throw new Error(result.message || `Could not save ${rating} for ${change.student.fullName}.`);
                    classPerformanceRecords = mergePerformanceRecords([record], classPerformanceRecords);
                } else if (!change.checked && matches.length) {
                    for (const record of matches) {
                        const response = await fetch(`${apiBase}/student-performance?recordId=${encodeURIComponent(record.id)}`, { method:'DELETE', headers:headers() });
                        if (!response.ok) throw new Error(`Could not remove ${rating} for ${change.student.fullName}.`);
                        classPerformanceRecords = classPerformanceRecords.filter(item => String(item.id) !== String(record.id));
                    }
                }
                pendingRatingChanges.delete(changeKey);
            }
            showSuccessModal('Saved', 'Student performance has been saved.');
        } catch (error) {
            showAppAlert(error.message || 'Performance could not be saved.', 'Save Failed');
        } finally {
            await loadClassPerformanceRecords();
            renderStudentRoster();
        }
    }

    async function loadClassPerformanceRecords() {
        const classStudents = students.filter(student => norm(student.classGrade) === norm(selectedClass) && norm(student.section || 'General') === norm(selectedStudentSection));
        const lists = await Promise.all(classStudents.map(async student => {
            try {
                const response = await fetch(`${apiBase}/student-performance?studentId=${encodeURIComponent(student.id)}`, { headers: headers() });
                const result = await response.json();
                if (!response.ok || !result.success) throw new Error(result.message || 'Performance could not be loaded.');
                return mergePerformanceRecords(result.performances || []);
            } catch (_) {
                return [];
            }
        }));
        classPerformanceRecords = lists.flat();
    }

        const date = document.getElementById('modalPerformanceDate').value || today();
        const month = document.getElementById('modalPerformanceMonth').value || date.slice(0, 7);
        const record = {
            id: document.getElementById('modalRecordId').value,
            studentId: String(selectedStudent.id),
            studentName: selectedStudent.fullName || '',
            classGrade: selectedClass,
            section: selectedStudentSection,
            subject: selectedSubject,

            assessmentItem: selectedSkill || document.getElementById('modalSkill').value.trim(),

            skill: selectedSkill || document.getElementById('modalSkill').value.trim(),
            learningOutcome: document.getElementById('modalLearningOutcome').value.trim(),
            excellentDescription: document.getElementById('modalExcellent').value.trim(),
            satisfactoryDescription: document.getElementById('modalSatisfactory').value.trim(),
            needsPracticeDescription: document.getElementById('modalNeedsPractice').value.trim(),
            rating: 'Excellent',
            performanceDate: date,
            performanceMonth: month,
            percentage: 100,
            remarks: ''
        };
        selectedSection = record.assessmentSection;
        record.id = performanceIdFor(record);
        const hasExcellent = Boolean(record.excellentDescription);
        const hasSatisfactory = Boolean(record.satisfactoryDescription);
        const hasNeedsPractice = Boolean(record.needsPracticeDescription);
        if (hasExcellent) { record.rating = 'Excellent'; record.assessmentRating = 'Advance'; record.percentage = 92; record.grade = 'Advance'; }
        else if (hasSatisfactory) { record.rating = 'Satisfactory'; record.assessmentRating = 'Proficient'; record.percentage = 77; record.grade = 'Proficient'; }
        else if (hasNeedsPractice) { record.rating = 'Needs Practice'; record.assessmentRating = 'Developing'; record.percentage = 60; record.grade = 'Developing'; }
        const chosenRatingFilled = selectedRating === 'excellent' ? hasExcellent : selectedRating === 'satisfactory' ? hasSatisfactory : selectedRating === 'needsPractice' ? hasNeedsPractice : (hasExcellent || hasSatisfactory || hasNeedsPractice);
        if (!record.skill || !record.learningOutcome || !chosenRatingFilled) {
            showAppAlert('Fill Learning Outcome and the selected rating description.', 'Incomplete Form');
            return;
        }
        const button = document.getElementById('saveSkill');
        button.disabled = true;
        try {
            const response = await fetch(`${apiBase}/student-performance`, { method:'POST', headers:headers(), body:JSON.stringify(record) });
            const result = await response.json();
            if (!response.ok || !result.success) throw new Error(result.message || 'Performance could not be saved.');
            classPerformanceRecords = mergePerformanceRecords([record], classPerformanceRecords);
            const returned = Array.isArray(result.performances) ? result.performances : [];
            saved = mergePerformanceRecords(returned.some(item => item.skill) ? returned : [record]);
            await loadClassPerformanceRecords();
            renderStudentRoster();
            if (keepAdding) {
                openPerformanceModal({ assessmentSection: selectedSection });
            } else {
                closePerformanceModal();
                showSuccessModal('Successfully Saved', 'Performance has been saved successfully.');
            }
        } catch (error) {
            closePerformanceModal();
            await loadClassPerformanceRecords();
            renderStudentRoster();
            showAppAlert(error.message || 'Performance could not be saved.', 'Save Failed');
        }
    }

    async function deletePerformanceRecord(recordId) {
        if (!recordId) return;
        if (!(await showAppConfirm('Delete this performance record?'))) return;
        const beforeDelete = saved;
        saved = saved.filter(record => String(record.id) !== String(recordId));
        renderSkillEditor(selectedSubject);
        try {
            const response = await fetch(`${apiBase}/student-performance?recordId=${encodeURIComponent(recordId)}`, { method:'DELETE', headers:headers() });
            const result = await response.json().catch(() => ({}));
            if (!response.ok || result.success === false) throw new Error(result.message || 'Performance record could not be deleted.');
        } catch (error) {
            saved = beforeDelete;
            renderSkillEditor(selectedSubject);
            showAppAlert(error.message, 'Delete Failed');
        }
    }

    function getVisiblePerformanceRecords() {
        return [...workspace.querySelectorAll('[data-performance-card="true"]')].map(card => ({
            id: card.dataset.record || '',
            studentId: String(selectedStudent?.id || ''),
            studentName: selectedStudent?.fullName || '',
            classGrade: selectedClass,
            subject: card.dataset.subject || selectedSubject,
            skill: card.dataset.skill || '',
            learningOutcome: card.dataset.learningOutcome || '',
            excellentDescription: card.dataset.excellent || '',
            satisfactoryDescription: card.dataset.satisfactory || '',
            needsPracticeDescription: card.dataset.needsPractice || '',
            performanceDate: card.dataset.date || ''
        })).filter(record => record.skill);
    }

    function getPrintablePerformanceRecords(sectionOnly = '') {
        const subject = selectedSubject;
        return saved.filter(record => record.skill && norm(record.subject) === norm(subject) && (!sectionOnly || (record.assessmentSection || 'Portfolio Skills Assessment Summary') === sectionOnly));
    }

    function printReport(sectionOnly = '') {
        const records = getPrintablePerformanceRecords(sectionOnly);
        if (!records.length) {
            showAppAlert('No performance records are available for this subject.', 'Nothing To Print');
            return;
        }
        const portfolioMonth = records[0]?.performanceMonth || String(records[0]?.performanceDate || '').slice(0, 7) || 'Month-Year';
        const sections = ['Portfolio Skills Assessment Summary','Performance Task','Learning Attitude'];
        const rows = sections.map(section => { const sectionRecords = records.filter(record => (record.assessmentSection || 'Portfolio Skills Assessment Summary') === section); if (!sectionRecords.length) return ''; return `<tr class="section-row"><th colspan="5">${esc(section)}</th></tr>` + sectionRecords.map(record => `<tr><td class="skill"><strong>${esc(record.assessmentItem || record.skill)}</strong><small>${esc(record.performanceDate || '')}</small></td><td>${esc(record.assessmentRating || '')}</td><td>${esc(record.learningOutcome || record.skill || '')}</td><td>${esc(record.excellentDescription || '')}</td><td>${esc(record.satisfactoryDescription || record.needsPracticeDescription || '')}</td></tr>`).join(''); }).join('');
        const html = `<!DOCTYPE html><html><head><title>${esc(selectedSubject)} Progress</title><style>@page{size:A4 landscape;margin:10mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#1f2937;margin:0;font-size:10px}.head{display:flex;align-items:center;justify-content:center;gap:12px;border:2px solid #374151;border-radius:24px;padding:7px 18px;margin-bottom:8px}.logo{width:48px;height:48px;object-fit:contain}.head h1{margin:0;text-align:center;font-size:18px}.head p{margin:3px 0 0;text-align:center;font-size:12px}.meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}.box{border:1px solid #6b7280;padding:5px 8px;min-height:25px}.report{width:100%;border-collapse:collapse;table-layout:fixed}.report th,.report td{border:1px solid #4b5563;padding:5px;vertical-align:top;line-height:1.18;word-break:break-word}.report th{background:#e5e7eb;text-align:center;font-size:11px}.report th:nth-child(1){width:13%}.report th:nth-child(2){width:25%}.report th:nth-child(3),.report th:nth-child(4),.report th:nth-child(5){width:20.66%}.skill{font-size:11px}.skill small{display:block;margin-top:5px;color:#4b5563;font-size:9px}.circle{font-size:16px;line-height:10px;margin-right:4px;vertical-align:-1px}.signatures{display:grid;grid-template-columns:1fr 1fr 1fr;gap:45px;margin-top:20px;font-size:11px}.line{border-top:1px solid #374151;padding-top:4px;text-align:center}@media print{.head,.report th{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><div class="head"><img class="logo" src="${esc(logoSrc)}" alt="School logo"><div><h1>Beacon Light School System</h1><p>${esc(selectedSubject)} Progress Report</p></div></div><div class="meta"><div class="box"><strong>Name:</strong> ${esc(selectedStudent.fullName || '')}</div><div class="box"><strong>Class:</strong> ${esc(selectedClass)}</div><div class="box"><strong>Roll No:</strong> ${esc(selectedStudent.rollNo || selectedStudent.studentCode || '-')}</div></div><table class="report"><thead><tr><th>Skills</th><th>Learning Outcome</th><th>Excellent</th><th>Satisfactory</th><th>Needs Practice</th></tr></thead><tbody>${rows}</tbody></table><div class="signatures"><div class="line">Teacher's Signature</div><div class="line">School Stamp</div><div class="line">Parent Signature</div></div></body></html>`;
        openPrintableReport(html
            .replace('</style>', '.section-row th{background:#dcefe4;font-size:13px}</style>')
            .replace('<th>Skills</th><th>Learning Outcome</th><th>Excellent</th><th>Satisfactory</th><th>Needs Practice</th>', '<th>Assessment Item</th><th>Rating</th><th>Learning Outcome / Skill</th><th>Excellent</th><th>Satisfactory / Needs Practice</th>')
            .replace('</style>', '.portfolio-head{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;border:1px solid #777;border-radius:18px;background:#e5e5e5;padding:7px 18px;margin-bottom:8px;font-weight:800;text-align:center}.portfolio-head span:first-child{text-align:left}.portfolio-head span:last-child{text-align:right}.meta{display:none!important}.stamp-line{border-top:0!important;font-size:13px;font-weight:800;line-height:1.35}</style>')
            .replace(/<div class="head">[\s\S]*?<\/div><div class="meta">/, `<div class="portfolio-head"><span>Portfolio_${esc(portfolioMonth)}</span><span>${esc(selectedSubject)}</span><span>${esc(selectedStudent.fullName || '')}</span></div><div class="meta">`)
            .replace('<th>Excellent</th>', '<th>😊 Excellent</th>')
            .replace('<th>Satisfactory</th>', '<th>🙂 Satisfactory</th>')
            .replace('<th>Needs Practice</th>', '<th>😟 Needs Practice</th>')
            .replace('<div class="line">School Stamp</div>', '<div class="line stamp-line">Beacon Light School System Jand<br>School Stamp</div>'));
    }

    function openPrintableReport(html) {
        const win = window.open('', '_blank', 'width=1000,height=800');
        if (win) {
            win.document.open();
            win.document.write(html);
            win.document.close();
            const triggerPrint = () => {
                win.focus();
                win.print();
            };
            win.onload = triggerPrint;
            win.setTimeout(triggerPrint, 450);
            return;
        }

        const frame = document.createElement('iframe');
        frame.style.position = 'fixed';
        frame.style.right = '0';
        frame.style.bottom = '0';
        frame.style.width = '1px';
        frame.style.height = '1px';
        frame.style.border = '0';
        document.body.appendChild(frame);
        const doc = frame.contentWindow.document;
        doc.open();
        doc.write(html);
        doc.close();
        setTimeout(() => {
            frame.contentWindow.focus();
            frame.contentWindow.print();
            setTimeout(() => frame.remove(), 3000);
        }, 350);
    }

    async function init() {
        try {
            const loggedInUser = JSON.parse(sessionStorage.getItem('loggedInUser') || 'null');
            courses = JSON.parse(localStorage.getItem('eduCore_student_courses') || '[]');
            scheduledSubjects = JSON.parse(localStorage.getItem('eduCore_student_schedules') || '[]');
            attendanceStore = {};
            examResults = [];
            let studentData = [];
            let studentsLoaded = true;
            if (loggedInUser?.role === 'Teacher') {
                isTeacherUser = true;
                const assignedResponse = await fetch(`${apiBase}/teacher/testing-result-students`, { headers:headers(), cache:'no-store' });
                const assignedData = await assignedResponse.json().catch(() => ({}));
                teacherAssignments = Array.isArray(assignedData.assignments) ? assignedData.assignments : [];
                students = assignedResponse.ok && Array.isArray(assignedData.students) ? assignedData.students.filter(teacherCanAccessStudent) : [];
                studentsLoaded = assignedResponse.ok;
                teacherAssignedSubjects = String(new URLSearchParams(location.search).get('assignedSubjects') || '').split('|').map(value => value.trim()).filter(Boolean);
                if (!teacherAssignedSubjects.length) {
                    const teacherResponse = await fetch(`${apiBase}/teacher/me`, { headers:headers(), cache:'no-store' });
                    const teacherData = await teacherResponse.json().catch(() => ({}));
                    teacherAssignedSubjects = String(teacherData.subject || teacherData.subjects || '').split(/[,|]/).map(value => value.trim()).filter(Boolean);
                }
            } else {
                const studentResponse = await fetch(`${apiBase}/students`, { cache:'no-store' });
                studentData = await studentResponse.json().catch(() => ({}));
                studentsLoaded = studentResponse.ok;
                students = studentResponse.ok
                    ? (Array.isArray(studentData) ? studentData : Array.isArray(studentData.students) ? studentData.students : [])
                    : [];
            }
            renderClasses();
            if (!studentsLoaded && !classNames().length) workspace.innerHTML = '<div class="empty-state"><strong>Assigned students could not be loaded.</strong><p>Please check the server connection, then reload.</p></div>';
        } catch (_error) {
            students = [];
            renderClasses();
            workspace.innerHTML = '<div class="empty-state">Students could not be loaded. Please check the server connection and reload.</div>';
        }
    }

    window.printCurrentStudentPerformanceReport = () => {
        printReport();
    };

    init();
    if (window.lucide) lucide.createIcons();
})();
</script>
</body>
</html>
