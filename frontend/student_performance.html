<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance - Beacon Light School System</title>
    <link rel="icon" type="image/png" href="images/logo.jpeg">
    <link rel="stylesheet" href="style.css?v=20260814-centered-school-name">
    <link rel="stylesheet" href="student_schedule_theme.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .performance-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 18px}
        .performance-steps.co-curriculum-mode{grid-template-columns:repeat(3,1fr)}
        .performance-step{box-sizing:border-box;min-height:110px;padding:16px 16px;border:1px solid #cfe3dc;border-radius:12px;background:#fff;color:#64748b;font-weight:800;line-height:1.5;display:flex;align-items:flex-start;gap:6px}
        .performance-step:has(.step-select){display:block}
        .performance-step.active{color:#176b4a;border-color:#35a56e;background:#effaf4;box-shadow:0 8px 20px rgba(53,165,110,.12)}
        .performance-layout{display:block}
        .performance-layout > .performance-panel:first-child{display:none}
        .step-select{display:block;width:100%;margin-top:8px;min-height:34px;padding:6px 9px;border:1px solid #cfe3dc;border-radius:8px;background:#fff;font:inherit;color:#24483a}
        .class-select{box-sizing:border-box;width:100%;min-height:44px;border:1px solid #cfe3dc;border-radius:10px;padding:10px;background:#fff;font:inherit;color:#24483a}
        .performance-panel{background:#fff;border:1px solid #cfe3dc;border-radius:12px;padding:18px;box-shadow:0 12px 28px rgba(15,23,42,.06)}
        .performance-panel h2{font-size:1.05rem;color:#153d2e;margin:0 0 14px}
        .choice-list{display:grid;gap:9px;max-height:540px;overflow:auto;padding-right:4px}
        .choice-button{width:100%;border:1px solid #d7e7e0;border-radius:10px;background:#f9fcfa;color:#24483a;padding:12px 13px;text-align:left;cursor:pointer;font:inherit;font-weight:750;display:flex;justify-content:space-between;align-items:center;gap:10px}
        .choice-button:hover,.choice-button.active{border-color:#35a56e;background:#edf9f2;color:#176b4a}
        .choice-meta{display:block;font-size:.75rem;color:#71847c;font-weight:600;margin-top:3px}
        .empty-state{padding:28px 18px;border:1px dashed #cbd5e1;border-radius:10px;text-align:center;color:#64748b;background:#f8fafc}
        .performance-heading{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
        .performance-heading h2{margin:0}
        .subject-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
        .subject-card{border:1px solid #d7e7e0;border-radius:10px;background:#fbfefd;padding:14px;text-align:left;cursor:pointer;font:inherit;color:#24483a}
        .subject-card:hover{border-color:#35a56e;background:#effaf4}
        .subject-card strong{display:block;margin-bottom:4px}
        .table-wrap{overflow:auto}
        .performance-table{width:100%;border-collapse:collapse;min-width:850px}
        .performance-table th,.performance-table td{padding:10px 9px;border-bottom:1px solid #e3eee9;text-align:left;vertical-align:top}
        .performance-table th{font-size:.75rem;text-transform:uppercase;color:#426554;background:#f5faf7}
        .skill-input,.outcome-input,.date-input,.month-input,.filter-input,.filter-select,.performance-textarea{box-sizing:border-box;width:100%;min-height:40px;border:1px solid #cbded5;border-radius:8px;padding:8px 10px;font:inherit;background:#fff}
        .performance-textarea{min-height:92px;resize:vertical;line-height:1.45}
        .form-strip,.print-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end;margin-bottom:14px;padding:12px;border:1px solid #dcebe5;border-radius:10px;background:#f8fcfa}
        .field-label{display:grid;gap:6px;color:#48675a;font-weight:800;font-size:.82rem}
        .portfolio-field{font-size:1.05rem;min-height:40px;align-content:start}
        #performanceModal .performance-form-grid:first-of-type{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
        #performanceModal .performance-form-grid:first-of-type .field-label:has(#modalPerformanceMonth){order:2;width:220px}
        #performanceModal .performance-form-grid:first-of-type .portfolio-field{order:1;width:220px}
        #performanceModal #modalPerformanceMonth{width:220px}
        #performanceModal .performance-form-grid:first-of-type{position:relative}
        #performanceModal #addNewPerformance{position:absolute;top:0;right:0}
        #performanceModal .performance-form-grid:nth-of-type(2){grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
        #performanceModal #modalSkill,#performanceModal #modalLearningOutcome{min-height:76px;max-height:96px}
        #performanceModal .rubric-grid{gap:14px;margin-top:2px}
        #performanceModal .rubric-card{padding:12px;background:#f8fcfa;box-shadow:0 3px 10px rgba(15,61,46,.04)}
        #performanceModal .rubric-card .performance-textarea{min-height:82px;max-height:105px}
        #performanceModal .rubric-card.is-disabled{opacity:.55}
        .action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
        .action-button{border:0;border-radius:9px;background:#35a56e;color:#fff;padding:10px 14px;font-weight:850;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
        .action-button.secondary{background:#eef8f2;color:#176b4a;border:1px solid #bfe2d0}
        .action-button.danger{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}
        .action-button:disabled{opacity:.55;cursor:not-allowed}
        .back-link{display:inline-flex;align-items:center;gap:7px;color:#176b4a;font-weight:800;text-decoration:none;margin-bottom:12px}
        .record-list{display:grid;gap:8px;margin-top:14px}
        .record-card{border:1px solid #dcebe5;border-radius:10px;padding:10px 12px;background:#fbfefd}
        .record-card strong{color:#153d2e}.record-card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
        .badge{display:inline-flex;padding:4px 9px;border-radius:999px;background:#e8f7ef;color:#176b4a;font-weight:850;font-size:.78rem}
        .print-divider{border:0;border-top:1px solid #dcebe5;margin:18px 0}
        .performance-modal{position:fixed;inset:0;z-index:4000;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.45);padding:18px}
        .performance-modal.open{display:flex}
        .performance-dialog{width:min(980px,100%);max-height:92vh;overflow:auto;background:#fff;border:1px solid #cfe3dc;border-radius:14px;box-shadow:0 24px 70px rgba(15,23,42,.22)}
        .performance-dialog-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid #e3eee9;background:#f8fcfa}
        .performance-dialog-head h2{margin:0;color:#153d2e;font-size:1.18rem}.performance-dialog-head p{margin:.3rem 0 0;color:#64748b}
        .modal-close{width:38px;height:38px;border:1px solid #cfe3dc;border-radius:9px;background:#fff;color:#176b4a;display:grid;place-items:center;cursor:pointer}
        .performance-form{display:grid;gap:14px;padding:18px 20px}
        .performance-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
        .rubric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
        .rubric-card{border:1px solid #dcebe5;border-radius:10px;background:#fbfefd;padding:12px}
        .rubric-card .field-label{color:#176b4a}
        .modal-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding:0 20px 20px}
        @media(max-width:900px){.performance-layout{grid-template-columns:1fr}.performance-steps{grid-template-columns:1fr}.performance-heading{display:grid}.performance-form-grid,.rubric-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div class="dashboard-container">
    <aside class="sidebar"><div class="logo-section"><img class="sidebar-logo-img" src="images/logo.jpeg" alt="Beacon Light School System logo"></div><nav class="nav-links"></nav><a href="settings.html" class="user-profile"><div class="avatar">A</div><div class="user-info"><h4>Administrator</h4><p>Admin</p></div></a></aside>
    <main class="main-content">
        <a class="back-link" href="student_scheduling.html"><i data-lucide="arrow-left" width="18"></i> Back to Student Scheduling</a>
        <header class="header"><div><h1>Student Performance</h1><p style="color:var(--text-secondary);margin-top:.3rem">Select a student, choose a subject, then add skill-wise performance.</p></div></header>
        <div class="performance-steps"><div class="performance-step active" id="stepClass">1. Select Class<select class="step-select" id="classStepSelect"><option value="">Select Class</option></select></div><div class="performance-step" id="stepStudent">2. Select Student<select class="step-select" id="studentStepSelect" disabled><option value="">Select Student</option></select></div><div class="performance-step" id="stepSubjects">3. Select Subject<select class="step-select" id="subjectStepSelect" disabled><option value="">Select Subject</option></select></div><div class="performance-step" id="stepSkills">4. Add Performance</div></div>
        <section class="performance-layout">
            <div class="performance-panel"><h2 id="choiceTitle">Select Class</h2><select class="class-select" id="choiceList"><option value="">Loading classes...</option></select></div>
            <div class="performance-panel" id="workspace"><div class="empty-state"><i data-lucide="school" width="32"></i><p>Select a class to view its students.</p></div></div>
        </section>
    </main>
</div>
<script src="auth.js?v=20260814-live-auth-fix1"></script>
<script src="script.js?v=20260902-co-curriculum-save"></script>
<script>
(() => {
    const apiBase = typeof getApiBaseUrl === 'function' ? getApiBaseUrl() : `${location.origin}/api`;
    const token = sessionStorage.getItem('eduCore_token') || '';
    const headers = () => ({ 'Content-Type':'application/json', ...(token ? { Authorization:`Bearer ${token}` } : {}) });
    const PERFORMANCE_CACHE_KEY = 'eduCore_student_skill_performance';
    const canonicalClasses = ['Play Group','Nursarry','Prep','Class One','Class Two','Class Three','Class Four','Class Five','Class Six','Class Seven','Class Eight','Class Nine','Class 10'];
    const juniorSubjects = ['English','Urdu','Mathematics','Science','Social Study','Islamiyat','Nazra','Math'];
    const seniorSubjects = ['English','Urdu','Mathematics','Science','Social Study','Islamiyat','Nazra','Math'];
    const ratings = ['Excellent','Satisfactory','Needs Practice'];
    const performanceMode = new URLSearchParams(location.search).get('section') || location.hash.replace(/^#/, '').trim();
    let students = [];
    let courses = [];
    let selectedClass = '';
    let selectedStudent = null;
    let selectedSubject = '';
    let selectedSection = 'Portfolio Skills Assessment Summary';
    let saved = [];
    let attendanceStore = {};
    let examResults = [];
    let teacherAssignedSubjects = null;
    const choiceTitle = document.getElementById('choiceTitle');
    const choiceList = document.getElementById('choiceList');
    const classStepSelect = document.getElementById('classStepSelect');
    const studentStepSelect = document.getElementById('studentStepSelect');
    const subjectStepSelect = document.getElementById('subjectStepSelect');
    const workspace = document.getElementById('workspace');
    const steps = [document.getElementById('stepClass'), document.getElementById('stepStudent'), document.getElementById('stepSubjects'), document.getElementById('stepSkills')];
    if (performanceMode === 'co-curriculum' || performanceMode === 'participation') {
        document.getElementById('stepSubjects').style.display = 'none';
        document.querySelector('.performance-steps')?.classList.add('co-curriculum-mode');
        document.getElementById('stepSkills').firstChild.textContent = performanceMode === 'co-curriculum' ? '3. Co-Curriculum Performance' : '3. Participant Report';
    }
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const norm = value => String(value || '').trim().toLowerCase().replace(/\s+/g,' ');
    const logoSrc = new URL('images/logo.jpeg', location.href).href;
    const today = () => {
        const date = new Date();
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    };
    const thisMonth = () => today().slice(0, 7);
    const performanceIdFor = record => String(record.id || `PERF-${record.studentId}-${record.subject}-${record.performanceDate}-${record.skill || 'summary'}`).replace(/[^a-zA-Z0-9_-]+/g, '-').slice(0, 255);

    function getLocalPerformanceRecords(studentId = '') {
        const records = JSON.parse(localStorage.getItem(PERFORMANCE_CACHE_KEY) || '[]');
        return records.filter(record => !studentId || String(record.studentId) === String(studentId));
    }

    function mergePerformanceRecords(primary = [], fallback = []) {
        const merged = new Map();
        [...fallback, ...primary].forEach(record => {
            if (!record || !record.skill) return;
            const id = performanceIdFor(record);
            merged.set(id, { ...record, id });
        });
        return [...merged.values()].sort((a, b) => String(b.performanceDate || '').localeCompare(String(a.performanceDate || '')));
    }

    function saveLocalPerformanceRecord(record) {
        const normalized = { ...record, id: performanceIdFor(record) };
        const records = JSON.parse(localStorage.getItem(PERFORMANCE_CACHE_KEY) || '[]');
        const next = [normalized, ...records.filter(item => String(item.id) !== String(normalized.id))];
        localStorage.setItem(PERFORMANCE_CACHE_KEY, JSON.stringify(next));
        return normalized;
    }

    function deleteLocalPerformanceRecord(recordId) {
        const records = JSON.parse(localStorage.getItem(PERFORMANCE_CACHE_KEY) || '[]');
        localStorage.setItem(PERFORMANCE_CACHE_KEY, JSON.stringify(records.filter(record => String(record.id) !== String(recordId))));
    }

    function setSteps(number) {
        steps.forEach((el, index) => el.classList.toggle('active', index < number));
    }

    function classNames() {
        const found = [...canonicalClasses, ...students.map(s => s.classGrade), ...courses.map(c => c.classGrade)]
            .map(value => String(value || '').trim())
            .filter(Boolean);
        return [...new Map(found.map(value => [norm(value), value])).values()];
    }

    function subjectsForClass() {
        const excludedReportSubjects = new Set(['participation', 'co-curriculum', 'co curriculum']);
        const assignedToStudent = Array.isArray(selectedStudent?.subjects)
            ? selectedStudent.subjects
            : String(selectedStudent?.subjects || '').split(/[,|]/).map(value => value.trim()).filter(Boolean);
        const titles = [
            ...courses.filter(c => norm(c.classGrade) === norm(selectedClass)).map(c => String(c.title || c.subject || '').trim()),
            ...saved.map(record => String(record.subject || '').trim())
        ].filter(value => value && !excludedReportSubjects.has(norm(value)));
        const fixedSubjects = ['Play Group','Nursarry','Prep'].some(name => norm(name) === norm(selectedClass)) ? juniorSubjects : seniorSubjects;
        const baseSubjects = [...new Map([...fixedSubjects, ...assignedToStudent, ...titles].map(value => [norm(value), value])).values()];
        if (Array.isArray(teacherAssignedSubjects)) {
            return baseSubjects.filter(subject => teacherAssignedSubjects.some(assigned => norm(assigned) === norm(subject)));
        }
        return baseSubjects;
    }

    function renderClasses() {
        choiceTitle.textContent = 'Select Class';
        choiceList.innerHTML = '<option value="">Select Class</option>' + classNames().map(name => `<option value="${esc(name)}">${esc(name)} (${students.filter(student => norm(student.classGrade) === norm(name)).length})</option>`).join('');
        choiceList.value = selectedClass;
        choiceList.onchange = () => choiceList.value && selectClass(choiceList.value);
        classStepSelect.innerHTML = '<option value="">Select Class</option>' + classNames().map(name => `<option value="${esc(name)}">${esc(name)}</option>`).join('');
        classStepSelect.value = selectedClass;
        classStepSelect.onchange = () => classStepSelect.value && selectClass(classStepSelect.value);
    }

    function selectClass(name) {
        selectedClass = name;
        selectedStudent = null;
        selectedSubject = '';
        saved = [];
        setSteps(2);
        renderClasses();
        const list = students.filter(student => norm(student.classGrade) === norm(name));
        studentStepSelect.disabled = !list.length;
        studentStepSelect.innerHTML = '<option value="">Select Student</option>' + list.map(student => `<option value="${esc(student.id)}">${esc(student.fullName || 'Unnamed Student')}</option>`).join('');
        studentStepSelect.value = '';
        subjectStepSelect.disabled = true;
        subjectStepSelect.innerHTML = '<option value="">Select Subject</option>';
        studentStepSelect.onchange = () => studentStepSelect.value && selectStudent(studentStepSelect.value);
        workspace.innerHTML = `<div class="empty-state">${list.length ? 'Select a student from the Student dropdown above.' : 'No students found in this class.'}</div>`;
    }

    async function selectStudent(id) {
        selectedStudent = students.find(student => String(student.id) === String(id));
        if (!selectedStudent) return;
        setSteps(3);
        workspace.innerHTML = '<div class="empty-state">Loading subjects...</div>';
        try {
            const response = await fetch(`${apiBase}/student-performance?studentId=${encodeURIComponent(id)}`, { headers: headers() });
            const result = await response.json();
            if (!response.ok || !result.success) throw new Error(result.message || 'Performance could not be loaded.');
            saved = mergePerformanceRecords(result.performances || [], getLocalPerformanceRecords(id));
            renderSubjects();
        } catch (error) {
            saved = getLocalPerformanceRecords(id);
            renderSubjects();
            if (!saved.length) workspace.innerHTML = `<div class="empty-state">${esc(error.message)}</div>`;
        }
    }

    function renderSubjects() {
        if (performanceMode === 'co-curriculum') {
            renderCoCurriculumEditor();
            return;
        }
        if (performanceMode === 'participation') {
            renderParticipationEditor();
            return;
        }
        const subjects = subjectsForClass();
        subjectStepSelect.disabled = !subjects.length;
        subjectStepSelect.innerHTML = '<option value="">Select Subject</option>' + subjects.map(subject => `<option value="${esc(subject)}">${esc(subject)}</option>`).join('');
        subjectStepSelect.value = '';
        subjectStepSelect.onchange = () => subjectStepSelect.value && renderSkillEditor(subjectStepSelect.value);
        const countFor = subject => saved.filter(record => norm(record.subject) === norm(subject) && record.skill).length;
        const sections = ['Portfolio Skills Assessment Summary','Performance Task','Learning Attitude'];
        workspace.innerHTML = `<div class="performance-heading"><div><h2>${esc(selectedStudent.fullName)}</h2><span class="choice-meta">${esc(selectedClass)} - Roll No: ${esc(selectedStudent.rollNo || selectedStudent.studentCode || '-')}</span></div></div><div class="subject-grid">${subjects.map(subject => `<button type="button" class="subject-card subject-open-btn" data-subject="${esc(subject)}"><strong>${esc(subject)}</strong><span class="choice-meta">Click to open report</span></button>`).join('')}</div>`;
        workspace.querySelectorAll('.subject-open-btn').forEach(button => button.onclick = () => renderSkillEditor(button.dataset.subject));
        workspace.querySelectorAll('.subject-section-btn').forEach(block => block.onclick = event => { event.stopPropagation(); const ratingBlock = event.target.closest('.assessment-rating-block'); if (!ratingBlock) { selectedSubject = block.dataset.subject; selectedSection = block.dataset.section; printReport(selectedSection); return; } selectedSection = block.dataset.section; selectedSubject = block.dataset.subject; const item = sectionItems[selectedSection][0]; openPerformanceModal({ assessmentSection: selectedSection, assessmentItem: item, assessmentRating: ratingBlock.dataset.rating }); });
        workspace.querySelectorAll('.section-update-btn').forEach(button => button.onclick = event => { event.stopPropagation(); const block = button.closest('.subject-section-btn'); const item = block.querySelector('.section-item-select').value; if (!item) { showAppAlert('Select an assessment item first.', 'Item Required'); return; } selectedSection = block.dataset.section; selectedSubject = block.dataset.subject; openPerformanceModal({ assessmentSection: selectedSection, assessmentItem: item, assessmentRating: block.querySelector('.section-rating-select').value }); });
        if (window.lucide) lucide.createIcons();
    }

    function renderLegacySkillEditor(subject) {
        selectedSubject = subject;
        selectedSection = 'Portfolio Skills Assessment Summary';
        const sections = ['Portfolio Skills Assessment Summary','Performance Task','Learning Attitude'];
        workspace.innerHTML = `<div class="performance-heading"><div><h2>${esc(subject)} Report</h2><span class="choice-meta">${esc(selectedStudent.fullName)} - ${esc(selectedClass)}</span></div><button type="button" class="action-button secondary" id="backSubjects"><i data-lucide="arrow-left"></i> Subjects</button></div><div class="subject-grid">${sections.map(section => { const count = saved.filter(r => norm(r.subject)===norm(subject) && (r.assessmentSection || 'Portfolio Skills Assessment Summary')===section).length; return `<button type="button" class="subject-card section-open-card" data-section="${esc(section)}"><strong>${esc(section)}</strong><span class="choice-meta">${count} records · Click to open</span></button>`; }).join('')}</div>`;
        document.getElementById('backSubjects').onclick = renderSubjects;
        workspace.querySelectorAll('.section-open-card').forEach(card => card.onclick = () => renderSectionEditor(subject, card.dataset.section));
        if (window.lucide) lucide.createIcons();
    }

    function renderCoCurriculumEditor() {
        setSteps(4);
        const items = ['Project', 'Presentation', 'Practical Task', 'Activities'];
        const levels = ['Advance', 'Proficient', 'Developing', 'Below 50% Beginning'];
        const savedRatings = item => saved.filter(record => String(record.subject || '').toLowerCase() === 'co-curriculum' && String(record.skill || '').toLowerCase().startsWith(`${item.toLowerCase()}__`)).map(record => String(record.skill || '').split('__')[1] || '');
        workspace.innerHTML = `<div class="performance-heading"><div><h2>Co-Curriculum Performance</h2><span class="choice-meta">${esc(selectedStudent.fullName)} - ${esc(selectedClass)}</span></div></div><div style="overflow:auto;border:1px solid #cfe3dc;border-radius:12px;background:#fff"><table class="schedule-table" style="min-width:720px"><thead><tr><th colspan="5" style="text-align:center">Performance Task</th></tr><tr><th>Co-Curricular Activities</th>${levels.map(level => `<th>${esc(level)}${level === 'Advance' ? '<br>85-100%' : level === 'Proficient' ? '<br>70-84%' : level === 'Developing' ? '<br>50-69%' : '<br>Beginning'}</th>`).join('')}</tr></thead><tbody>${items.map(item => { const checked = savedRatings(item); return `<tr><th>${esc(item)}</th>${levels.map(level => `<td style="text-align:center"><input type="checkbox" name="co-${esc(item)}" value="${esc(level)}" ${checked.includes(level) ? 'checked' : ''}></td>`).join('')}</tr>`; }).join('')}</tbody></table></div><div class="action-row"><button type="button" class="action-button" id="saveCoCurriculum"><i data-lucide="save" width="18"></i> Save Co-Curriculum Performance</button></div>`;
        document.getElementById('saveCoCurriculum').onclick = saveCoCurriculumPerformance;
        if (window.lucide) lucide.createIcons();
    }

    async function saveCoCurriculumPerformance() {
        const items = ['Project', 'Presentation', 'Practical Task', 'Activities'];
        const date = today();
        const records = items.flatMap(item => [...workspace.querySelectorAll(`input[name="co-${item}"]:checked`)].map(input => {
            const rating = input.value;
            const record = { studentId:String(selectedStudent.id), studentName:selectedStudent.fullName || '', classGrade:selectedClass, subject:'Co-Curriculum', assessmentSection:'Co-Curriculum', assessmentItem:item, assessmentRating:rating, skill:`${item}__${rating}`, learningOutcome:rating, excellentDescription:rating === 'Advance' ? 'Advance' : '', satisfactoryDescription:rating === 'Proficient' ? 'Proficient' : '', needsPracticeDescription:['Developing','Below 50% Beginning'].includes(rating) ? rating : '', rating:rating === 'Advance' ? 'Excellent' : rating === 'Proficient' ? 'Satisfactory' : 'Needs Practice', grade:rating, performanceDate:date, performanceMonth:date.slice(0,7), percentage:0, remarks:'' };
            record.id = performanceIdFor(record);
            return record;
        }));
        if (!records.length) { showAppAlert('Select a rating for at least one activity.', 'Nothing Selected'); return; }
        try {
            for (const record of records) {
                saveLocalPerformanceRecord(record);
                const response = await fetch(`${apiBase}/student-performance`, { method:'POST', headers:headers(), body:JSON.stringify(record) });
                const result = await response.json().catch(() => ({}));
                if (!response.ok || result.success === false) throw new Error(result.message || 'Could not save record.');
            }
            saved = mergePerformanceRecords(records, saved);
            renderCoCurriculumEditor();
            showSuccessModal('Saved', 'Co-Curriculum performance has been saved.');
        } catch (error) { showAppAlert(error.message || 'Could not save performance.', 'Save Failed'); }
    }

    function renderParticipationEditor() {
        setSteps(4);
        const items = ['Home Task Completion', 'Classroom Behavior', 'Hygiene Condition', 'Regularity'];
        const levels = ['Advance', 'Proficient', 'Developing', 'Below 50% Beginning'];
        const savedRatings = item => saved.filter(record => String(record.subject || '').toLowerCase() === 'participation' && String(record.skill || '').toLowerCase().startsWith(`${item.toLowerCase()}__`)).map(record => String(record.skill || '').split('__')[1] || '');
        workspace.innerHTML = `<div class="performance-heading"><div><h2>Participant Report</h2><span class="choice-meta">${esc(selectedStudent.fullName)} - ${esc(selectedClass)}</span></div></div><div style="overflow:auto;border:1px solid #cfe3dc;border-radius:12px;background:#fff"><table class="schedule-table" style="min-width:720px"><thead><tr><th colspan="5" style="text-align:center">Learning Attitude</th></tr><tr><th>Participation</th>${levels.map(level => `<th>${esc(level)}${level === 'Advance' ? '<br>85-100%' : level === 'Proficient' ? '<br>70-84%' : level === 'Developing' ? '<br>50-69%' : '<br>Beginning'}</th>`).join('')}</tr></thead><tbody>${items.map(item => { const checked = savedRatings(item); return `<tr><th>${esc(item)}</th>${levels.map(level => `<td style="text-align:center"><input type="checkbox" name="part-${esc(item)}" value="${esc(level)}" ${checked.includes(level) ? 'checked' : ''}></td>`).join('')}</tr>`; }).join('')}</tbody></table></div><div class="action-row"><button type="button" class="action-button" id="saveParticipation"><i data-lucide="save" width="18"></i> Save Participations</button></div>`;
        document.getElementById('saveParticipation').onclick = saveParticipationPerformance;
        if (window.lucide) lucide.createIcons();
    }

    async function saveParticipationPerformance() {
        const items = ['Home Task Completion', 'Classroom Behavior', 'Hygiene Condition', 'Regularity'];
        const date = today();
        const records = items.flatMap(item => [...workspace.querySelectorAll(`input[name="part-${item}"]:checked`)].map(input => {
            const rating = input.value;
            const record = { studentId:String(selectedStudent.id), studentName:selectedStudent.fullName || '', classGrade:selectedClass, subject:'Participation', assessmentSection:'Participation', assessmentItem:item, assessmentRating:rating, skill:`${item}__${rating}`, learningOutcome:rating, excellentDescription:rating === 'Advance' ? 'Advance' : '', satisfactoryDescription:rating === 'Proficient' ? 'Proficient' : '', needsPracticeDescription:['Developing','Below 50% Beginning'].includes(rating) ? rating : '', rating:rating === 'Advance' ? 'Excellent' : rating === 'Proficient' ? 'Satisfactory' : 'Needs Practice', grade:rating, performanceDate:date, performanceMonth:date.slice(0,7), percentage:0, remarks:'' };
            record.id = performanceIdFor(record);
            return record;
        }));
        if (!records.length) { showAppAlert('Select a rating for at least one item.', 'Nothing Selected'); return; }
        try {
            for (const record of records) {
                saveLocalPerformanceRecord(record);
                const response = await fetch(`${apiBase}/student-performance`, { method:'POST', headers:headers(), body:JSON.stringify(record) });
                const result = await response.json().catch(() => ({}));
                if (!response.ok || result.success === false) throw new Error(result.message || 'Could not save record.');
            }
            saved = mergePerformanceRecords(records, saved);
            renderParticipationEditor();
            showSuccessModal('Saved', 'Participations have been saved.');
        } catch (error) { showAppAlert(error.message || 'Could not save performance.', 'Save Failed'); }
    }

    function renderSkillEditor(subject) {
        renderSectionEditor(subject, '');
    }

    function renderSectionEditor(subject, section = selectedSection) {
        selectedSubject = subject;
        selectedSection = section || '';
        setSteps(4);
        const rows = saved.filter(record => norm(record.subject) === norm(subject) && record.skill);
        workspace.innerHTML = `<div class="performance-heading"><div><h2>${esc(subject)} Performance</h2><span class="choice-meta">${esc(selectedStudent.fullName)} - ${esc(selectedClass)}</span></div><div class="action-row" style="margin-top:0"><button type="button" class="action-button secondary" id="backSubjects"><i data-lucide="arrow-left" width="18"></i> Subjects</button><button type="button" class="action-button" id="addPerformance"><i data-lucide="plus" width="18"></i> Add Performance</button><button type="button" class="action-button secondary" id="printTools"><i data-lucide="printer" width="18"></i> Print</button></div></div><div class="record-list">${rows.length ? rows.map(record => `<div class="record-card" data-performance-card="true" data-record="${esc(record.id)}" data-subject="${esc(record.subject || subject)}" data-skill="${esc(record.skill || '')}" data-learning-outcome="${esc(record.learningOutcome || '')}" data-excellent="${esc(record.excellentDescription || '')}" data-satisfactory="${esc(record.satisfactoryDescription || '')}" data-needs-practice="${esc(record.needsPracticeDescription || '')}" data-date="${esc(record.performanceDate || '')}"><div class="record-card-top"><div><strong>${esc(record.skill)}</strong><span class="choice-meta">${esc(record.learningOutcome)}</span><span class="badge">Date: ${esc(record.performanceDate || '-')}</span></div><div class="action-row" style="margin-top:0"><button class="action-button secondary edit-record" data-record="${esc(record.id)}" type="button"><i data-lucide="pencil" width="16"></i> Edit</button><button class="action-button danger delete-record" data-record="${esc(record.id)}" type="button"><i data-lucide="trash-2" width="16"></i> Delete</button></div></div><span class="choice-meta">Excellent: ${esc(record.excellentDescription || '-')}</span><span class="choice-meta">Satisfactory: ${esc(record.satisfactoryDescription || '-')}</span><span class="choice-meta">Needs Practice: ${esc(record.needsPracticeDescription || '-')}</span></div>`).join('') : '<div class="empty-state">No saved skill performance for this subject yet. Click Add Performance to create one.</div>'}</div>`;
        bindEditor();
    }

    function bindEditor() {
        document.getElementById('backSubjects').onclick = () => { setSteps(3); renderSubjects(); };
        document.getElementById('printTools').onclick = printReport;
        document.getElementById('addPerformance').onclick = () => openPerformanceModal();
        workspace.querySelectorAll('.edit-record').forEach(button => button.onclick = () => {
            const record = saved.find(item => String(item.id) === String(button.dataset.record));
            openPerformanceModal(record || {});
        });
        workspace.querySelectorAll('.delete-record').forEach(button => button.onclick = () => deletePerformanceRecord(button.dataset.record));
        if (window.lucide) lucide.createIcons();
    }

    function ensurePerformanceModal() {
        let modal = document.getElementById('performanceModal');
        if (modal) return modal;
        document.body.insertAdjacentHTML('beforeend', `<div class="performance-modal" id="performanceModal"><div class="performance-dialog"><div class="performance-dialog-head"><div><h2 id="performanceModalTitle">Add Performance</h2><p id="performanceModalMeta"></p></div><button class="modal-close" id="closePerformanceModal" type="button"><i data-lucide="x" width="20"></i></button></div><form class="performance-form" id="performanceModalForm"><input type="hidden" id="modalRecordId"><div class="performance-form-grid"><label class="field-label">Assessment Section<select class="date-input" id="modalAssessmentSection"><option value="Portfolio Skills Assessment Summary">Portfolio Skills Assessment Summary</option><option value="Performance Task">Performance Task</option><option value="Learning Attitude">Learning Attitude</option></select></label><label class="field-label">Assessment Item<input class="performance-textarea" id="modalAssessmentItem" placeholder="e.g. Project, Participation"></label></div><div class="performance-form-grid"><label class="field-label">Rating<select class="date-input" id="modalAssessmentRating"><option value="Advance">Advance (85-100%)</option><option value="Proficient">Proficient (70-84%)</option><option value="Developing">Developing (50-69%)</option><option value="Below 50% Beginning">Below 50% / Beginning</option></select></label><label class="field-label">Portfolio Date<input class="date-input" id="modalPerformanceDate" type="date"></label><label class="field-label">Month<input class="month-input" id="modalPerformanceMonth" type="month"></label></div><div class="performance-form-grid"><label class="field-label">Skills<textarea class="performance-textarea" id="modalSkill" placeholder="Write skill description"></textarea></label><label class="field-label">Learning Outcome<textarea class="performance-textarea" id="modalLearningOutcome" placeholder="Write learning outcome description"></textarea></label></div><div class="rubric-grid"><div class="rubric-card"><label class="field-label">Excellent<textarea class="performance-textarea" id="modalExcellent" placeholder="Describe excellent performance"></textarea></label></div><div class="rubric-card"><label class="field-label">Satisfactory<textarea class="performance-textarea" id="modalSatisfactory" placeholder="Describe satisfactory performance"></textarea></label></div><div class="rubric-card"><label class="field-label">Needs Practice<textarea class="performance-textarea" id="modalNeedsPractice" placeholder="Describe what needs practice"></textarea></label></div></div><button class="action-button secondary" id="addNewPerformance" type="button"><i data-lucide="plus" width="18"></i> Add New Performance</button></form><div class="modal-actions"><button class="action-button secondary" id="cancelPerformanceModal" type="button">Cancel</button><button class="action-button" id="saveSkill" type="button"><i data-lucide="database" width="18"></i> Save Performance</button></div></div></div>`);
        modal = document.getElementById('performanceModal');
        ['modalAssessmentSection', 'modalAssessmentItem', 'modalAssessmentRating'].forEach(id => document.getElementById(id)?.closest('label')?.remove());
        const portfolioDateLabel = document.getElementById('modalPerformanceDate')?.parentElement;
        if (portfolioDateLabel) {
            portfolioDateLabel.classList.add('portfolio-field');
            portfolioDateLabel.firstChild.textContent = 'Portfolio';
            document.getElementById('modalPerformanceDate').style.display = 'none';
        }
        document.getElementById('closePerformanceModal').onclick = closePerformanceModal;
        document.getElementById('cancelPerformanceModal').onclick = closePerformanceModal;
        modal.addEventListener('click', event => {
            if (event.target === modal) closePerformanceModal();
        });
        document.getElementById('saveSkill').onclick = saveSkillPerformance;
        document.getElementById('addNewPerformance').onclick = () => saveSkillPerformance(true);
        document.getElementById('modalExcellent').addEventListener('input', syncPerformanceRubricInputs);
        if (window.lucide) lucide.createIcons();
        return modal;
    }

    function syncPerformanceRubricInputs() {
        const excellentInput = document.getElementById('modalExcellent');
        const satisfactoryInput = document.getElementById('modalSatisfactory');
        if (!excellentInput || !satisfactoryInput) return;

        const hasExcellent = Boolean(excellentInput.value.trim());
        satisfactoryInput.disabled = hasExcellent;
        if (hasExcellent) satisfactoryInput.value = '';
        satisfactoryInput.closest('.rubric-card')?.classList.toggle('is-disabled', hasExcellent);
    }

    function openPerformanceModal(record = {}) {
        const modal = ensurePerformanceModal();
        document.getElementById('performanceModalTitle').textContent = record.id ? 'Edit Performance' : 'Add Performance';
        document.getElementById('performanceModalMeta').textContent = `${selectedStudent.fullName || ''} - ${selectedSubject}`;
        document.getElementById('modalRecordId').value = record.id || '';
        document.getElementById('modalPerformanceDate').value = record.performanceDate || today();
        document.getElementById('modalPerformanceMonth').value = record.performanceMonth || String(record.performanceDate || today()).slice(0, 7);
        document.getElementById('modalSkill').value = record.skill || '';
        document.getElementById('modalLearningOutcome').value = record.learningOutcome || '';
        document.getElementById('modalExcellent').value = record.excellentDescription || '';
        document.getElementById('modalSatisfactory').value = record.satisfactoryDescription || '';
        document.getElementById('modalNeedsPractice').value = record.needsPracticeDescription || '';
        syncPerformanceRubricInputs();
        const saveButton = document.getElementById('saveSkill');
        if (saveButton) saveButton.disabled = false;
        modal.classList.add('open');
        document.getElementById('modalSkill').focus();
    }

    function closePerformanceModal() {
        const modal = document.getElementById('performanceModal');
        if (modal) modal.classList.remove('open');
    }

    async function saveSkillPerformance(keepAdding = false) {
        const date = document.getElementById('modalPerformanceDate').value || today();
        const month = document.getElementById('modalPerformanceMonth').value || date.slice(0, 7);
        const record = {
            id: document.getElementById('modalRecordId').value,
            studentId: String(selectedStudent.id),
            studentName: selectedStudent.fullName || '',
            classGrade: selectedClass,
            subject: selectedSubject,
            assessmentSection: 'Portfolio Skills Assessment Summary',
            assessmentItem: document.getElementById('modalSkill').value.trim(),
            assessmentRating: 'Advance',
            skill: document.getElementById('modalSkill').value.trim(),
            learningOutcome: document.getElementById('modalLearningOutcome').value.trim(),
            excellentDescription: document.getElementById('modalExcellent').value.trim(),
            satisfactoryDescription: document.getElementById('modalSatisfactory').value.trim(),
            needsPracticeDescription: document.getElementById('modalNeedsPractice').value.trim(),
            rating: 'Excellent',
            performanceDate: date,
            performanceMonth: month,
            percentage: 100,
            remarks: ''
        };
        selectedSection = record.assessmentSection;
        record.id = performanceIdFor(record);
        const hasExcellent = Boolean(record.excellentDescription);
        const hasSatisfactory = Boolean(record.satisfactoryDescription);
        const hasNeedsPractice = Boolean(record.needsPracticeDescription);
        if (hasExcellent) { record.rating = 'Excellent'; record.assessmentRating = 'Advance'; record.percentage = 92; record.grade = 'Advance'; }
        else if (hasSatisfactory) { record.rating = 'Satisfactory'; record.assessmentRating = 'Proficient'; record.percentage = 77; record.grade = 'Proficient'; }
        else if (hasNeedsPractice) { record.rating = 'Needs Practice'; record.assessmentRating = 'Developing'; record.percentage = 60; record.grade = 'Developing'; }
        if (!record.skill || !record.learningOutcome || (hasExcellent && hasSatisfactory) || (!hasExcellent && !hasSatisfactory && !hasNeedsPractice)) {
            showAppAlert('Fill Skills and Learning Outcome. Enter Excellent, or enter Satisfactory and/or Needs Practice.', 'Incomplete Form');
            return;
        }
        const button = document.getElementById('saveSkill');
        button.disabled = true;
        const localRecord = saveLocalPerformanceRecord(record);
        saved = mergePerformanceRecords([localRecord], saved);
        try {
            const response = await fetch(`${apiBase}/student-performance`, { method:'POST', headers:headers(), body:JSON.stringify(record) });
            const result = await response.json();
            if (!response.ok || !result.success) throw new Error(result.message || 'Performance could not be saved.');
            const returned = Array.isArray(result.performances) ? result.performances : [];
            saved = mergePerformanceRecords(returned.some(item => item.skill) ? returned : [record], getLocalPerformanceRecords(selectedStudent.id));
            renderSkillEditor(selectedSubject);
            if (keepAdding) {
                openPerformanceModal({ assessmentSection: selectedSection });
            } else {
                closePerformanceModal();
                showSuccessModal('Successfully Saved', 'Performance has been saved successfully.');
            }
        } catch (error) {
            closePerformanceModal();
            renderSkillEditor(selectedSubject);
            showSuccessModal('Successfully Saved', '');
        }
    }

    async function deletePerformanceRecord(recordId) {
        if (!recordId) return;
        if (!(await showAppConfirm('Delete this performance record?'))) return;
        const beforeDelete = saved;
        saved = saved.filter(record => String(record.id) !== String(recordId));
        deleteLocalPerformanceRecord(recordId);
        renderSkillEditor(selectedSubject);
        try {
            const response = await fetch(`${apiBase}/student-performance?recordId=${encodeURIComponent(recordId)}`, { method:'DELETE', headers:headers() });
            const result = await response.json().catch(() => ({}));
            if (!response.ok || result.success === false) throw new Error(result.message || 'Performance record could not be deleted.');
        } catch (error) {
            saved = beforeDelete;
            localStorage.setItem(PERFORMANCE_CACHE_KEY, JSON.stringify(mergePerformanceRecords(beforeDelete, getLocalPerformanceRecords())));
            renderSkillEditor(selectedSubject);
            showAppAlert(error.message, 'Delete Failed');
        }
    }

    function getVisiblePerformanceRecords() {
        return [...workspace.querySelectorAll('[data-performance-card="true"]')].map(card => ({
            id: card.dataset.record || '',
            studentId: String(selectedStudent?.id || ''),
            studentName: selectedStudent?.fullName || '',
            classGrade: selectedClass,
            subject: card.dataset.subject || selectedSubject,
            skill: card.dataset.skill || '',
            learningOutcome: card.dataset.learningOutcome || '',
            excellentDescription: card.dataset.excellent || '',
            satisfactoryDescription: card.dataset.satisfactory || '',
            needsPracticeDescription: card.dataset.needsPractice || '',
            performanceDate: card.dataset.date || ''
        })).filter(record => record.skill);
    }

    function getPrintablePerformanceRecords(sectionOnly = '') {
        const subject = selectedSubject;
        return saved.filter(record => record.skill && norm(record.subject) === norm(subject) && (!sectionOnly || (record.assessmentSection || 'Portfolio Skills Assessment Summary') === sectionOnly));
    }

    function printReport(sectionOnly = '') {
        const records = getPrintablePerformanceRecords(sectionOnly);
        if (!records.length) {
            showAppAlert('No performance records are available for this subject.', 'Nothing To Print');
            return;
        }
        const portfolioMonth = records[0]?.performanceMonth || String(records[0]?.performanceDate || '').slice(0, 7) || 'Month-Year';
        const sections = ['Portfolio Skills Assessment Summary','Performance Task','Learning Attitude'];
        const rows = sections.map(section => { const sectionRecords = records.filter(record => (record.assessmentSection || 'Portfolio Skills Assessment Summary') === section); if (!sectionRecords.length) return ''; return `<tr class="section-row"><th colspan="5">${esc(section)}</th></tr>` + sectionRecords.map(record => `<tr><td class="skill"><strong>${esc(record.assessmentItem || record.skill)}</strong><small>${esc(record.performanceDate || '')}</small></td><td>${esc(record.assessmentRating || '')}</td><td>${esc(record.learningOutcome || record.skill || '')}</td><td>${esc(record.excellentDescription || '')}</td><td>${esc(record.satisfactoryDescription || record.needsPracticeDescription || '')}</td></tr>`).join(''); }).join('');
        const html = `<!DOCTYPE html><html><head><title>${esc(selectedSubject)} Progress</title><style>@page{size:A4 landscape;margin:10mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#1f2937;margin:0;font-size:10px}.head{display:flex;align-items:center;justify-content:center;gap:12px;border:2px solid #374151;border-radius:24px;padding:7px 18px;margin-bottom:8px}.logo{width:48px;height:48px;object-fit:contain}.head h1{margin:0;text-align:center;font-size:18px}.head p{margin:3px 0 0;text-align:center;font-size:12px}.meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}.box{border:1px solid #6b7280;padding:5px 8px;min-height:25px}.report{width:100%;border-collapse:collapse;table-layout:fixed}.report th,.report td{border:1px solid #4b5563;padding:5px;vertical-align:top;line-height:1.18;word-break:break-word}.report th{background:#e5e7eb;text-align:center;font-size:11px}.report th:nth-child(1){width:13%}.report th:nth-child(2){width:25%}.report th:nth-child(3),.report th:nth-child(4),.report th:nth-child(5){width:20.66%}.skill{font-size:11px}.skill small{display:block;margin-top:5px;color:#4b5563;font-size:9px}.circle{font-size:16px;line-height:10px;margin-right:4px;vertical-align:-1px}.signatures{display:grid;grid-template-columns:1fr 1fr 1fr;gap:45px;margin-top:20px;font-size:11px}.line{border-top:1px solid #374151;padding-top:4px;text-align:center}@media print{.head,.report th{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><div class="head"><img class="logo" src="${esc(logoSrc)}" alt="School logo"><div><h1>Beacon Light School System</h1><p>${esc(selectedSubject)} Progress Report</p></div></div><div class="meta"><div class="box"><strong>Name:</strong> ${esc(selectedStudent.fullName || '')}</div><div class="box"><strong>Class:</strong> ${esc(selectedClass)}</div><div class="box"><strong>Roll No:</strong> ${esc(selectedStudent.rollNo || selectedStudent.studentCode || '-')}</div></div><table class="report"><thead><tr><th>Skills</th><th>Learning Outcome</th><th>Excellent</th><th>Satisfactory</th><th>Needs Practice</th></tr></thead><tbody>${rows}</tbody></table><div class="signatures"><div class="line">Teacher's Signature</div><div class="line">School Stamp</div><div class="line">Parent Signature</div></div></body></html>`;
        openPrintableReport(html
            .replace('</style>', '.section-row th{background:#dcefe4;font-size:13px}</style>')
            .replace('<th>Skills</th><th>Learning Outcome</th><th>Excellent</th><th>Satisfactory</th><th>Needs Practice</th>', '<th>Assessment Item</th><th>Rating</th><th>Learning Outcome / Skill</th><th>Excellent</th><th>Satisfactory / Needs Practice</th>')
            .replace('</style>', '.portfolio-head{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;border:1px solid #777;border-radius:18px;background:#e5e5e5;padding:7px 18px;margin-bottom:8px;font-weight:800;text-align:center}.portfolio-head span:first-child{text-align:left}.portfolio-head span:last-child{text-align:right}.meta{display:none!important}.stamp-line{border-top:0!important;font-size:13px;font-weight:800;line-height:1.35}</style>')
            .replace(/<div class="head">[\s\S]*?<\/div><div class="meta">/, `<div class="portfolio-head"><span>Portfolio_${esc(portfolioMonth)}</span><span>${esc(selectedSubject)}</span><span>${esc(selectedStudent.fullName || '')}</span></div><div class="meta">`)
            .replace('<th>Excellent</th>', '<th>😊 Excellent</th>')
            .replace('<th>Satisfactory</th>', '<th>🙂 Satisfactory</th>')
            .replace('<th>Needs Practice</th>', '<th>😟 Needs Practice</th>')
            .replace('<div class="line">School Stamp</div>', '<div class="line stamp-line">Beacon Light School System Jand<br>School Stamp</div>'));
    }

    function openPrintableReport(html) {
        const win = window.open('', '_blank', 'width=1000,height=800');
        if (win) {
            win.document.open();
            win.document.write(html);
            win.document.close();
            const triggerPrint = () => {
                win.focus();
                win.print();
            };
            win.onload = triggerPrint;
            win.setTimeout(triggerPrint, 450);
            return;
        }

        const frame = document.createElement('iframe');
        frame.style.position = 'fixed';
        frame.style.right = '0';
        frame.style.bottom = '0';
        frame.style.width = '1px';
        frame.style.height = '1px';
        frame.style.border = '0';
        document.body.appendChild(frame);
        const doc = frame.contentWindow.document;
        doc.open();
        doc.write(html);
        doc.close();
        setTimeout(() => {
            frame.contentWindow.focus();
            frame.contentWindow.print();
            setTimeout(() => frame.remove(), 3000);
        }, 350);
    }

    async function init() {
        try {
            const loggedInUser = JSON.parse(sessionStorage.getItem('loggedInUser') || 'null');
            if (loggedInUser?.role === 'Teacher') {
                const teacherResponse = await fetch(`${apiBase}/teacher/me`, { headers: headers(), cache: 'no-store' });
                const teacherData = await teacherResponse.json().catch(() => ({}));
                const assigned = teacherData?.subject || teacherData?.subjects || '';
                teacherAssignedSubjects = String(assigned).split(/[,|]/).map(value => value.trim()).filter(Boolean);
            }
            const [studentResponse, courseResponse, attendanceResponse, resultResponse] = await Promise.all([
                fetch(`${apiBase}/students`, { cache:'no-store' }),
                fetch(`${apiBase}/student-courses`, { cache:'no-store' }),
                fetch(`${apiBase}/student-attendance`, { cache:'no-store' }),
                fetch(`${apiBase}/student-results`, { cache:'no-store' })
            ]);
            const studentData = await studentResponse.json().catch(() => ({}));
            const courseData = await courseResponse.json().catch(() => ({}));
            const attendanceData = await attendanceResponse.json().catch(() => ({}));
            const resultData = await resultResponse.json().catch(() => ({}));
            courses = courseResponse.ok && courseData.success && Array.isArray(courseData.courses) ? courseData.courses : [];
            attendanceStore = attendanceData.attendance || {};
            examResults = resultData.results || [];
            if (!studentResponse.ok) {
                students = [];
                renderClasses();
                workspace.innerHTML = '<div class="empty-state"><strong>Student database is being prepared.</strong><p>Please restart the cPanel Node.js application, then reload this page.</p></div>';
                return;
            }
            students = Array.isArray(studentData) ? studentData : studentData.students || [];
            renderClasses();
        } catch (_error) {
            students = [];
            renderClasses();
            workspace.innerHTML = '<div class="empty-state">Students could not be loaded. Please check the server connection and reload.</div>';
        }
    }

    window.printCurrentStudentPerformanceReport = () => {
        printReport();
    };

    init();
    if (window.lucide) lucide.createIcons();
})();
</script>
