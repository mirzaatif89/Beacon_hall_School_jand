<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance - Beacon Light School System</title>
    <link rel="icon" type="image/png" href="images/logo.jpeg">
    <link rel="stylesheet" href="style.css?v=20260814-centered-school-name">
    <link rel="stylesheet" href="student_schedule_theme.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .performance-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 18px}.performance-step{padding:13px 16px;border:1px solid #cfe3dc;border-radius:14px;background:#fff;color:#64748b;font-weight:800}.performance-step.active{color:#176b4a;border-color:#35a56e;background:#effaf4;box-shadow:0 8px 20px rgba(53,165,110,.12)}
        .performance-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px}.performance-panel{background:#fff;border:1px solid #cfe3dc;border-radius:16px;padding:18px;box-shadow:0 12px 28px rgba(15,23,42,.06)}.performance-panel h2{font-size:1.05rem;color:#153d2e;margin:0 0 14px}.choice-list{display:grid;gap:9px;max-height:540px;overflow:auto;padding-right:4px}.choice-button{width:100%;border:1px solid #d7e7e0;border-radius:12px;background:#f9fcfa;color:#24483a;padding:12px 13px;text-align:left;cursor:pointer;font:inherit;font-weight:750;display:flex;justify-content:space-between;align-items:center;gap:10px}.choice-button:hover,.choice-button.active{border-color:#35a56e;background:#edf9f2;color:#176b4a}.choice-meta{display:block;font-size:.75rem;color:#71847c;font-weight:600;margin-top:3px}.empty-state{padding:28px 18px;border:1px dashed #cbd5e1;border-radius:13px;text-align:center;color:#64748b;background:#f8fafc}.performance-heading{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.performance-heading h2{margin:0}.performance-table{width:100%;border-collapse:collapse}.performance-table th,.performance-table td{padding:12px 10px;border-bottom:1px solid #e3eee9;text-align:left;vertical-align:middle}.performance-table th{font-size:.75rem;text-transform:uppercase;color:#597165;background:#f5faf7}.percentage-input,.remarks-input{box-sizing:border-box;width:100%;min-height:40px;border:1px solid #cbded5;border-radius:9px;padding:8px 10px;font:inherit}.percentage-input{max-width:115px}.grade-badge{display:inline-flex;min-width:42px;justify-content:center;padding:6px 9px;border-radius:999px;background:#e8f7ef;color:#176b4a;font-weight:900}.summary-card{display:flex;gap:8px;align-items:center;color:#475569;font-size:.9rem}.save-performance{border:0;border-radius:10px;background:#35a56e;color:#fff;padding:11px 16px;font-weight:850;cursor:pointer;display:inline-flex;gap:7px;align-items:center}.save-performance:disabled{opacity:.55;cursor:not-allowed}.back-link{display:inline-flex;align-items:center;gap:7px;color:#176b4a;font-weight:800;text-decoration:none;margin-bottom:12px}@media(max-width:900px){.performance-layout{grid-template-columns:1fr}.performance-steps{grid-template-columns:1fr}.performance-table{min-width:650px}.table-wrap{overflow:auto}}
    </style>
</head>
<body>
<div class="dashboard-container">
    <aside class="sidebar"><div class="logo-section"><img class="sidebar-logo-img" src="images/logo.jpeg" alt="Beacon Light School System logo"></div><nav class="nav-links"></nav><a href="settings.html" class="user-profile"><div class="avatar">A</div><div class="user-info"><h4>Administrator</h4><p>Admin</p></div></a></aside>
    <main class="main-content">
        <a class="back-link" href="student_scheduling.html"><i data-lucide="arrow-left" width="18"></i> Back to Student Scheduling</a>
        <header class="header"><div><h1>Student Performance</h1><p style="color:var(--text-secondary);margin-top:.3rem">Select a class and student, then manage subject-wise percentages.</p></div></header>
        <div class="performance-steps"><div class="performance-step active" id="stepClass">1. Select Class</div><div class="performance-step" id="stepStudent">2. Select Student</div><div class="performance-step" id="stepSubjects">3. Manage Performance</div></div>
        <section class="performance-layout">
            <div class="performance-panel"><h2 id="choiceTitle">Classes</h2><div class="choice-list" id="choiceList"><div class="empty-state">Loading classes...</div></div></div>
            <div class="performance-panel" id="workspace"><div class="empty-state"><i data-lucide="school" width="32"></i><p>Select a class to view its students.</p></div></div>
        </section>
    </main>
</div>
<script src="auth.js?v=20260814-live-auth-fix1"></script>
<script src="script.js?v=20260814-local-runtime-fix6"></script>
<script>
(() => {
    const apiBase = typeof getApiBaseUrl === 'function' ? getApiBaseUrl() : `${location.origin}/api`;
    const token = sessionStorage.getItem('eduCore_token') || '';
    const headers = () => ({ 'Content-Type':'application/json', ...(token ? { Authorization:`Bearer ${token}` } : {}) });
    const canonicalClasses = ['Play Group','Nursarry','Prep','Class One','Class Two','Class Three','Class Four','Class Five','Class Six','Class Seven','Class Eight','Class Nine','Class 10'];
    const juniorSubjects = ['English','Urdu','Mathematics','General Knowledge','Islamiyat','Art'];
    const seniorSubjects = ['English','Urdu','Mathematics','General Science','Islamiyat','Computer'];
    let students = [], courses = [], selectedClass = '', selectedStudent = null, saved = [];
    const choiceTitle = document.getElementById('choiceTitle');
    const choiceList = document.getElementById('choiceList');
    const workspace = document.getElementById('workspace');
    const stepClass = document.getElementById('stepClass');
    const stepStudent = document.getElementById('stepStudent');
    const stepSubjects = document.getElementById('stepSubjects');
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const norm = value => String(value || '').trim().toLowerCase().replace(/\s+/g,' ');
    const gradeFor = p => p >= 90 ? 'A+' : p >= 80 ? 'A' : p >= 70 ? 'B' : p >= 60 ? 'C' : p >= 50 ? 'D' : 'F';
    function setSteps(number){ [stepClass,stepStudent,stepSubjects].forEach((el,i)=>el.classList.toggle('active', i < number)); }
    function classNames(){ const found=[...canonicalClasses,...students.map(s=>s.classGrade),...courses.map(c=>c.classGrade)].map(v=>String(v||'').trim()).filter(Boolean); return [...new Map(found.map(v=>[norm(v),v])).values()]; }
    function renderClasses(){ choiceTitle.textContent='Classes'; choiceList.innerHTML=classNames().map(name=>{const count=students.filter(s=>norm(s.classGrade)===norm(name)).length;return `<button class="choice-button ${norm(name)===norm(selectedClass)?'active':''}" data-class="${esc(name)}"><span>${esc(name)}<small class="choice-meta">${count} student${count===1?'':'s'}</small></span><i data-lucide="chevron-right" width="18"></i></button>`}).join(''); choiceList.querySelectorAll('[data-class]').forEach(btn=>btn.onclick=()=>selectClass(btn.dataset.class)); lucide.createIcons(); }
    function selectClass(name){ selectedClass=name; selectedStudent=null; saved=[]; setSteps(2); renderClasses(); const list=students.filter(s=>norm(s.classGrade)===norm(name)); workspace.innerHTML=`<div class="performance-heading"><h2>${esc(name)} Students</h2><span class="summary-card">${list.length} enrolled</span></div><div class="choice-list">${list.length?list.map(s=>`<button class="choice-button" data-student="${esc(s.id)}"><span>${esc(s.fullName||'Unnamed Student')}<small class="choice-meta">Roll No: ${esc(s.rollNo||s.studentCode||'-')} · ${esc(s.campusName||'Main Campus')}</small></span><i data-lucide="chevron-right" width="18"></i></button>`).join(''):'<div class="empty-state">No students found in this class.</div>'}</div>`; workspace.querySelectorAll('[data-student]').forEach(btn=>btn.onclick=()=>selectStudent(btn.dataset.student)); lucide.createIcons(); }
    function subjectsForClass(){ const titles=[...courses.filter(c=>norm(c.classGrade)===norm(selectedClass)).map(c=>String(c.title||'').trim()),...saved.map(r=>String(r.subject||'').trim())].filter(Boolean); if(titles.length) return [...new Map(titles.map(v=>[norm(v),v])).values()]; return ['Play Group','Nursarry','Prep'].some(c=>norm(c)===norm(selectedClass))?juniorSubjects:seniorSubjects; }
    async function selectStudent(id){ selectedStudent=students.find(s=>String(s.id)===String(id)); if(!selectedStudent)return; setSteps(3); workspace.innerHTML='<div class="empty-state">Loading subject performance...</div>'; try{const response=await fetch(`${apiBase}/student-performance?studentId=${encodeURIComponent(id)}`,{headers:headers()});const result=await response.json();if(!response.ok||!result.success)throw new Error(result.message||'Performance could not be loaded.');saved=result.performances||[];renderPerformance();}catch(error){workspace.innerHTML=`<div class="empty-state">${esc(error.message)}</div>`;} }
    function updateAverage(){const values=[...workspace.querySelectorAll('.percentage-input')].map(input=>Math.max(0,Math.min(100,Number(input.value)||0)));const average=values.length?values.reduce((sum,value)=>sum+value,0)/values.length:0;const label=document.getElementById('performanceAverage');if(label)label.textContent=`Overall: ${average.toFixed(1)}% (${gradeFor(average)})`;}
    function renderPerformance(){ const subjects=subjectsForClass(); const rows=subjects.map(subject=>{const record=saved.find(r=>norm(r.subject)===norm(subject));const percentage=record?Number(record.percentage):0;return `<tr data-subject="${esc(subject)}"><td><strong>${esc(subject)}</strong></td><td><input class="percentage-input" type="number" min="0" max="100" step="0.01" value="${percentage}" aria-label="${esc(subject)} percentage"></td><td><span class="grade-badge">${gradeFor(percentage)}</span></td><td><input class="remarks-input" type="text" value="${esc(record?.remarks||'')}" placeholder="Add remarks"></td></tr>`}).join(''); workspace.innerHTML=`<div class="performance-heading"><div><h2>${esc(selectedStudent.fullName)}</h2><span class="choice-meta">${esc(selectedClass)} · Roll No: ${esc(selectedStudent.rollNo||selectedStudent.studentCode||'-')}</span><span class="choice-meta" id="performanceAverage"></span></div><button class="save-performance" id="savePerformance"><i data-lucide="database" width="18"></i> Save Performance</button></div><div class="table-wrap"><table class="performance-table"><thead><tr><th>Subject</th><th>Percentage</th><th>Grade</th><th>Remarks</th></tr></thead><tbody>${rows}</tbody></table></div>`; workspace.querySelectorAll('.percentage-input').forEach(input=>input.addEventListener('input',()=>{const value=Math.max(0,Math.min(100,Number(input.value)||0));input.closest('tr').querySelector('.grade-badge').textContent=gradeFor(value);updateAverage();})); document.getElementById('savePerformance').onclick=saveAll; updateAverage(); lucide.createIcons(); }
    async function saveAll(){ const button=document.getElementById('savePerformance'); const records=[...workspace.querySelectorAll('tbody tr')].map(row=>{const percentage=Math.max(0,Math.min(100,Number(row.querySelector('.percentage-input').value)||0));return{studentId:String(selectedStudent.id),studentName:selectedStudent.fullName||'',classGrade:selectedClass,subject:row.dataset.subject,percentage,grade:gradeFor(percentage),remarks:row.querySelector('.remarks-input').value.trim()}}); button.disabled=true;button.innerHTML='Saving...';try{const response=await fetch(`${apiBase}/student-performance`,{method:'POST',headers:headers(),body:JSON.stringify(records)});const result=await response.json();if(!response.ok||!result.success)throw new Error(result.message||'Performance could not be saved.');saved=result.performances||records;renderPerformance();showSuccessModal('Performance Saved!','All subject percentages have been saved in the database.');}catch(error){showAppAlert(error.message,'Save Failed');renderPerformance();} }
    async function init(){ try{const [studentResponse,courseResponse]=await Promise.all([fetch(`${apiBase}/students`,{cache:'no-store'}),fetch(`${apiBase}/student-courses`,{cache:'no-store'})]);const studentData=await studentResponse.json().catch(()=>({}));const courseData=await courseResponse.json().catch(()=>({}));courses=courseResponse.ok&&courseData.success&&Array.isArray(courseData.courses)?courseData.courses:[];if(!studentResponse.ok){students=[];renderClasses();workspace.innerHTML='<div class="empty-state"><strong>Student database is being prepared.</strong><p>Please restart the cPanel Node.js application, then reload this page.</p></div>';return;}students=Array.isArray(studentData)?studentData:studentData.students||[];renderClasses();}catch(_error){students=[];renderClasses();workspace.innerHTML='<div class="empty-state">Students could not be loaded. Please check the server connection and reload.</div>';} }
    init(); if(window.lucide)lucide.createIcons();
})();
</script>
</body>
</html>
