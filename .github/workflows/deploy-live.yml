name: Deploy Beacon Light to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  REPOSITORY: https://github.com/mirzaatif89/Beacon_hall_School_jand.git
  BRANCH: main

jobs:
  sync:
    name: 1 - Sync Beacon source
    runs-on: ubuntu-latest
    steps:
      - name: Verify PM2 is available
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -eu
            command -v pm2

      - name: Verify PM2 process 4 is running
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -eu
            PM2_PID="$(pm2 pid 4 | tr -d '[:space:]')"
            test -n "$PM2_PID"
            test "$PM2_PID" != "0"

      - name: Verify PM2 working directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -eu
            PM2_PID="$(pm2 pid 4 | tr -d '[:space:]')"
            APP_PATH="$(readlink -f "/proc/$PM2_PID/cwd")"
            test -d "$APP_PATH"

      - name: Verify Node application files
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -eu
            PM2_PID="$(pm2 pid 4 | tr -d '[:space:]')"
            APP_PATH="$(readlink -f "/proc/$PM2_PID/cwd")"
            cd "$APP_PATH"
            test -f package.json

      - name: Configure remote and fetch main
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          envs: REPOSITORY,BRANCH
          script: |
            set -eu
            PM2_PID="$(pm2 pid 4 | tr -d '[:space:]')"
            APP_PATH="$(readlink -f "/proc/$PM2_PID/cwd")"
            cd "$APP_PATH"

            BACKUP_PATH="$APP_PATH/.deploy-backup"
            mkdir -p "$BACKUP_PATH"
            for file in .env data/permissions.json data/date_sheet.json data/admin_credentials.json; do
              if [ -f "$file" ]; then
                mkdir -p "$BACKUP_PATH/$(dirname "$file")"
                cp "$file" "$BACKUP_PATH/$file"
              fi
            done

            if [ ! -d .git ]; then
              git init
            fi
            git config --global --add safe.directory "$APP_PATH"
            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin "$REPOSITORY"
            else
              git remote add origin "$REPOSITORY"
            fi
            git fetch origin "$BRANCH" --prune

      - name: Checkout main and verify frontend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          envs: BRANCH
          script: |
            set -eu
            PM2_PID="$(pm2 pid 4 | tr -d '[:space:]')"
            APP_PATH="$(readlink -f "/proc/$PM2_PID/cwd")"
            cd "$APP_PATH"
            BACKUP_PATH="$APP_PATH/.deploy-backup"

            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"

            for file in .env data/permissions.json data/date_sheet.json data/admin_credentials.json; do
              if [ -f "$BACKUP_PATH/$file" ]; then
                mkdir -p "$(dirname "$file")"
                cp "$BACKUP_PATH/$file" "$file"
              fi
            done

            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$BRANCH)"
            grep -q "filters:v4-standard-classes" frontend/script.js
            grep -q "20260814-sidebar-sequence" frontend/students.html

  dependencies:
    name: 2 - Install production dependencies
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Install Node packages
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -eu
            PM2_PID="$(pm2 pid 4 | tr -d '[:space:]')"
            APP_PATH="$(readlink -f "/proc/$PM2_PID/cwd")"
            cd "$APP_PATH"
            npm install --omit=dev

  restart:
    name: 3 - Restart Beacon PM2 app
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Restart and verify process
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -eu
            PM2_PID="$(pm2 pid 4 | tr -d '[:space:]')"
            APP_PATH="$(readlink -f "/proc/$PM2_PID/cwd")"
            cd "$APP_PATH"
            pm2 restart 4 --update-env
            pm2 save
            test -n "$(pm2 pid 4)"
            echo "Beacon Light deployed successfully: $(git rev-parse HEAD)"
