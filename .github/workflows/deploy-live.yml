name: Deploy Beacon Light to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  APP_PATH: /home/ehsan/projects/American_lyceum
  REPOSITORY: https://github.com/mirzaatif89/Beacon_hall_School_jand.git
  BRANCH: main

jobs:
  sync:
    name: 1 - Sync Beacon source
    runs-on: ubuntu-latest
    steps:
      - name: Verify production app path
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          envs: APP_PATH,REPOSITORY,BRANCH
          script: |
            set -eu
            cd "$APP_PATH"
            test -d .git

      - name: Configure remote and fetch main
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          envs: APP_PATH,REPOSITORY,BRANCH
          script: |
            set -eu
            cd "$APP_PATH"

            BACKUP_PATH="$APP_PATH/.deploy-backup"
            mkdir -p "$BACKUP_PATH"
            for file in .env data/permissions.json data/date_sheet.json data/admin_credentials.json; do
              if [ -f "$file" ]; then
                mkdir -p "$BACKUP_PATH/$(dirname "$file")"
                cp "$file" "$BACKUP_PATH/$file"
              fi
            done

            git config --global --add safe.directory "$APP_PATH"
            git remote set-url origin "$REPOSITORY"
            git fetch origin "$BRANCH" --prune

      - name: Checkout main and verify frontend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          envs: APP_PATH,BRANCH
          script: |
            set -eu
            cd "$APP_PATH"
            BACKUP_PATH="$APP_PATH/.deploy-backup"

            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"

            for file in .env data/permissions.json data/date_sheet.json data/admin_credentials.json; do
              if [ -f "$BACKUP_PATH/$file" ]; then
                mkdir -p "$(dirname "$file")"
                cp "$BACKUP_PATH/$file" "$file"
              fi
            done

            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$BRANCH)"
            grep -q "filters:v4-standard-classes" frontend/script.js
            grep -q "20260814-sidebar-sequence" frontend/students.html

  dependencies:
    name: 2 - Install production dependencies
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Install Node packages
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          envs: APP_PATH
          script: |
            set -eu
            cd "$APP_PATH"
            npm install --omit=dev

  restart:
    name: 3 - Restart Beacon PM2 app
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Restart and verify process
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          envs: APP_PATH
          script: |
            set -eu
            cd "$APP_PATH"
            pm2 restart 4 --update-env
            pm2 save
            test -n "$(pm2 pid 4)"
            echo "Beacon Light deployed successfully: $(git rev-parse HEAD)"
